<style>
  :root{color-scheme:light;--ink:#424242;--ink-2:#6B6B6B;--ink-3:#9E9E9E;--line:#EEEEEE;--prc:#B6BDFF;--prs:#4C56C9;
    --font:"Roboto Condensed","Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#EEEEEE;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:40px 16px}
  .wrap{width:100%;max-width:640px;background:#fff;border-radius:20px;padding:40px;display:flex;flex-direction:column;gap:28px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img{width:40px;height:40px;display:block}
  .brand span{font-size:24px;font-weight:600;letter-spacing:3.2px;line-height:24px;
    background:linear-gradient(90deg,#0073F5 3.85%,#42D6CD 34.82%,#FABF32 69.95%,#FF5024 99.99%);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1{margin:0;font-size:22px;font-weight:700;letter-spacing:2px}
  .lead{margin:6px 0 0;font-size:14px;color:var(--ink-2);line-height:1.7}
  .list{display:flex;flex-direction:column;gap:12px}
  .item{display:flex;align-items:center;gap:16px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 0 0 var(--line);
    text-decoration:none;color:inherit;transition:border-color .15s,background .15s}
  .item:hover{border-color:var(--prc);background:#FAFAFF}
  .item:focus-visible{outline:2px solid var(--prs);outline-offset:2px}
  .bar{width:4px;align-self:stretch;background:var(--c);flex:none;border-radius:1px}
  .item b{display:block;font-size:16px;font-weight:600;letter-spacing:2px}
  .item p{margin:4px 0 0;font-size:13px;color:var(--ink-2);line-height:1.6}
  .item .go{margin-left:auto;font-size:13px;font-weight:600;color:var(--prs);letter-spacing:1px;white-space:nowrap}
  .item.disabled{pointer-events:none;opacity:.55}
  .item.disabled .go{color:var(--ink-3)}
  .note{margin:0;font-size:12px;color:var(--ink-3);line-height:1.7;border-top:1px solid var(--line);padding-top:16px}
  @media (max-width:520px){ .wrap{padding:28px 20px} .item{flex-wrap:wrap} .item .go{margin-left:20px} }
</style>
</head>
