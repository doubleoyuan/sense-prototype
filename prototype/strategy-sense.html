<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>策略 SENSE</title>
<link rel="icon" type="image/svg+xml" href="shared/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/tokens.css?v=20261110a">
<link rel="stylesheet" href="shared/components.css?v=20261110f">
<link rel="stylesheet" href="shared/forms.css?v=20261109a">
<style>
  /* ── 策略 SENSE 頁內元件：UI Library 尚未收錄，需求確認後再決定是否抽到 shared/ ── */

  /* StrategyCard：策略卡片。外框用共用的 TabCard（.tab-card），右上小頁籤顯示交換方式 */
  /* 公司頁籤：logo＋名稱＋版本＋認證標章。只有名稱會以「…」截斷，版本與認證標章固定顯示在最後 */
  .ss-tab .ver{flex:none;margin-left:-6px;font-size:12px;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-500);white-space:nowrap}
  .ss-verified{width:16px;height:16px;flex:none;margin-left:-6px;color:var(--badge-blue)}
  /* 交換方式頁籤（.tab-card-side）：圖示＋「單向／雙向」 */
  /* 交換方式圖示：上方箭頭往右（去）、下方箭頭往左（回）。單向時「回」為淡灰，雙向時兩支同色 */
  .ss-mode-ic{width:16px;height:16px;flex:none;overflow:visible}
  .ss-mode-ic path{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ss-tab-mode[data-mode="oneway"] .ss-mode-ic .back{stroke:var(--black-300)}
  /* 動畫：進入畫面播一次（.is-play，播完移除），hover／鍵盤聚焦卡片時再播。
     去的箭頭從左側淡入、往右滑到定位；雙向時回的箭頭同時從右側淡入、往左滑；單向的淡灰箭頭不動。只動一次 */
  .ss-tab-mode.is-play .fwd,.ss-card:hover .ss-tab-mode .fwd,.ss-card:focus-visible .ss-tab-mode .fwd{animation:ss-arrow-r .6s ease-out}
  .ss-tab-mode[data-mode="twoway"].is-play .back,.ss-card:hover .ss-tab-mode[data-mode="twoway"] .back,
  .ss-card:focus-visible .ss-tab-mode[data-mode="twoway"] .back{animation:ss-arrow-l .6s ease-out}
  @keyframes ss-arrow-r{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  @keyframes ss-arrow-l{from{opacity:0;transform:translateX(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .ss-mode-ic path{animation:none !important} }
  /* 人數與價格合成一個框（.r-card-metrics.compact.stacked）：上方人數、下方價格 */
  .ss-prices{width:100%;margin-top:10px;border-collapse:collapse;border-top:1px solid var(--black-300);font-size:12px;line-height:16px;letter-spacing:var(--tracking-wider);white-space:nowrap}
  .ss-prices th{padding:10px 0 0;font-weight:600;color:var(--black-500);text-align:left}
  /* 價格數值同上方人數的樣式：數字放大、單位（NT$）維持原字級並放在數字後 */
  .ss-prices td{padding:10px 0 0 12px;font-size:14px;font-weight:500;line-height:24px;letter-spacing:var(--tracking-super);color:var(--black-700);text-align:right}
  .ss-prices td em{font-size:18px;font-style:normal}
  /* 條件標籤：同受眾包卡片的 AI 標籤列（單行、左右捲動、兩側淡出） */
  .ss-tags{min-width:0;display:flex;gap:20px;margin:0;padding:0;list-style:none;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;cursor:grab}
  .ss-tags::-webkit-scrollbar{display:none}
  .ss-tags.is-dragging{cursor:grabbing;user-select:none}
  .ss-tags{--fade-l:0px;--fade-r:0px;
    -webkit-mask-image:linear-gradient(to right,transparent,black var(--fade-l),black calc(100% - var(--fade-r)),transparent);
    mask-image:linear-gradient(to right,transparent,black var(--fade-l),black calc(100% - var(--fade-r)),transparent)}
  .ss-tags.fade-l{--fade-l:32px}
  .ss-tags.fade-r{--fade-r:32px}
  /* 每個標籤：實心 tag 圖示＋文字，同為淺藍（目前模組的 --accent），不加底色 */
  .ss-tags li{flex:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:4px 0;
    color:var(--accent);font-size:13px;line-height:20px;letter-spacing:var(--tracking-wider)}
  .ss-tags li svg{width:14px;height:14px;flex:none}
  /* 發起媒合預估：共用的藍色外框按鈕（.btn-outline-blue），撐滿卡片寬度、貼齊卡片底部 */
  .tab-card-body .btn-outline-blue{width:100%;margin-top:auto}
</style>
</head>
<body>
<!-- 僅供內部使用，非經許可不得外流。頁面中的公司、策略與數據皆為示意。 -->
<div class="app" data-module="strategy" data-page="home">
  <aside class="sidebar" id="sidebar" aria-label="主選單"></aside>
  <div class="main">
    <header class="header" id="header"></header>

    <main class="content">
      <!-- 區塊：策略列表 -->
      <section class="content-section" aria-labelledby="browse-title">
        <div class="section-title" id="browse">
          <h2 id="browse-title">瀏覽策略</h2>
          <button class="title-btn" data-todo="上架策略"><img src="shared/assets/ic-plus-white.svg" alt=""><span>上架策略</span></button>
        </div>

        <div class="list-toolbar">
          <div class="chips" id="chips" role="group" aria-label="策略分類"></div>
          <div class="list-actions" id="list-actions"></div>
        </div>
        <div class="card-grid" id="grid" aria-live="polite"></div>
        <div class="pager" id="pager"></div>
      </section>
    </main>
  </div>
</div>

<script src="shared/shell.js?v=20261110a"></script>
<script src="shared/components.js?v=20261028d"></script>
<script>
/* ═════════ 示意資料（僅供原型展示） ═════════ */
const ORGS = {
  sf: { name:'股感媒體', mark:'stockfeel' },
  lx: { name:'聯想感', color:'#FFA940' }
};

const CATEGORIES = [ { key:'all', label:'ALL' } ];

// ver 為策略版本；tags 為「同時具備以下全部條件」的會員標籤；price 為每千人費用；mode 為交換方式（見 MODES）
const STRATEGIES = [
  { id:'s1', org:'sf', ver:'v3 MA', title:'金融理財_郵件', size:200, order:3,
    desc:'需求方付費並於 DCR 內取得標籤；數據方取得分潤、不取得需求方名單。',
    tags:['金融市場', '投資資訊', '行銷內容'], price:500, mode:'oneway' },
  { id:'s2', org:'lx', ver:'v3', title:'茶飲品牌_郵件', size:10, order:2,
    desc:'需求方付費並於 DCR 內取得標籤；數據方取得分潤、不取得需求方名單。',
    tags:['茶飲愛好者', '郵件行銷', '品牌推廣'], price:500, mode:'twoway' },
  { id:'s3', org:'lx', ver:'v3', title:'茶飲品牌_測試2', size:10, order:1,
    desc:'需求方付費並於 DCR 內取得標籤；數據方取得分潤、不取得需求方名單。',
    tags:['茶飲文化', '創新飲品', '社交體驗'], price:500, mode:'oneway' }
];

const SORTS = [
  { key:'newest', label:'最新上架' },
  { key:'size',   label:'符合人數：多到少' }
];
const PER_PAGE = 12;

const VERIFIED = '<svg class="ss-verified" viewBox="0 0 16 16" aria-label="已認證"><path fill="currentColor" d="M8 .8l1.7 1.3 2.1-.2.8 2 1.9 1-.3 2.1L15.2 8 14 9.7l.3 2.1-1.9 1-.8 2-2.1-.2L8 15.2l-1.7-1.3-2.1.2-.8-2-1.9-1 .3-2.1L.8 8 2 6.3 1.7 4.2l1.9-1 .8-2 2.1.2z"/><path d="M5.3 8.2l1.8 1.8 3.6-3.7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
// 交換方式：單向與雙向共用同一個圖示（上去下回的半箭頭），單向時「回」的箭頭淡灰，由 CSS 依 data-mode 切換
const MODES = {
  oneway: { label:'單向', full:'單向交換' },
  twoway: { label:'雙向', full:'雙向交換' }
};
const MODE_IC = '<svg class="ss-mode-ic" viewBox="0 0 16 16" aria-hidden="true"><path class="back" d="M12 10.5H3l2.5 2.5"/><path class="fwd" d="M4 5.5h9l-2.5-2.5"/></svg>';
// 實心 tag 圖示，孔洞以 evenodd 挖空
const TAG = '<svg viewBox="0 0 16 16" fill="currentColor" fill-rule="evenodd" aria-hidden="true"><path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h4.1a1.5 1.5 0 0 1 1.06.44l5.2 5.2a1.5 1.5 0 0 1 0 2.12l-4.1 4.1a1.5 1.5 0 0 1-2.12 0l-5.2-5.2A1.5 1.5 0 0 1 2 7.6zM5.75 4.4a1.35 1.35 0 1 0 0 2.7 1.35 1.35 0 0 0 0-2.7z"/></svg>';

/* ═════════ 卡片 ═════════ */
const { esc } = SenseUI;
const num = (n) => n.toLocaleString('en-US');

/* 標題 → 條件標籤 → 說明（至多兩行）→ 人數與價格框 → 按鈕 */
function strategyCard(s){
  const org = ORGS[s.org], mode = MODES[s.mode];
  return `
    <article class="tab-card ss-card" data-card="${s.id}" tabindex="0" aria-label="${esc(s.title)}，${esc(org.name)}">
      <div class="tab-card-tabs">
        <div class="tab-card-org ss-tab" title="${esc(org.name)}（${esc(s.ver)}）">${SenseUI.orgLogo(org)}<span class="org-name">${esc(org.name)}</span><span class="ver">(${esc(s.ver)})</span>${VERIFIED}</div>
        <div class="tab-card-side ss-tab-mode" data-mode="${s.mode}" aria-label="${mode.full}">${MODE_IC}${mode.label}</div>
      </div>
      <div class="tab-card-body">
        <div class="tab-card-intro">
          <h3 class="tab-card-title" title="${esc(s.title)}">${esc(s.title)}</h3>
          <ul class="ss-tags" tabindex="0" aria-label="同時具備以下全部條件">${s.tags.map(t => `<li>${TAG}${esc(t)}</li>`).join('')}</ul>
          <p class="tab-card-desc" title="${esc(s.desc)}">${esc(s.desc)}</p>
        </div>
        <div class="r-card-metrics compact stacked">
          <span class="metric"><small>符合人數</small><b><em>${num(s.size)}</em> 人</b></span>
          <table class="ss-prices">
            <tbody>
              <tr><th scope="row">每千人</th><td><em>${num(s.price)}</em> NT$</td></tr>
            </tbody>
          </table>
        </div>
        <button class="btn btn-outline-blue" data-estimate="${s.id}">發起媒合預估</button>
      </div>
    </article>`;
}

/* ═════════ 狀態與渲染 ═════════ */
const state = { cat:'all', query:'', sort:'newest', page:1 };

function filtered(){
  const q = state.query.toLowerCase();
  const list = STRATEGIES.filter(s => !q || [s.title, ORGS[s.org].name, ...s.tags].some(t => t.toLowerCase().includes(q)));
  const by = {
    newest: (a, b) => b.order - a.order,
    size:   (a, b) => b.size - a.size
  }[state.sort];
  return list.sort(by);
}

function renderList(){
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  state.page = Math.min(state.page, pages);
  const slice = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);

  document.getElementById('grid').innerHTML = slice.length
    ? slice.map(strategyCard).join('')
    : `<p class="empty" style="grid-column:1/-1">找不到符合「${esc(state.query)}」的策略<br>換個關鍵字試試看</p>`;
  document.getElementById('pager').innerHTML = SenseUI.pagination(state.page, pages);
  updateFades();
  if (modeIO) document.querySelectorAll('.ss-tab-mode').forEach(el => modeIO.observe(el));
}

/* 交換方式圖示：卡片進入畫面時播一次動畫，播完移除 class，之後 hover 時由 CSS 再播 */
const modeIO = 'IntersectionObserver' in window ? new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    modeIO.unobserve(e.target);
    e.target.classList.add('is-play');
    e.target.querySelector('.fwd').addEventListener('animationend', () => e.target.classList.remove('is-play'), { once:true });
  });
}, { threshold:1 }) : null;

/* 標籤列兩側淡出：左邊有捲過才淡出左側，右邊還有內容才淡出右側 */
function updateFade(list){
  const max = list.scrollWidth - list.clientWidth;
  list.classList.toggle('fade-l', list.scrollLeft > 1);
  list.classList.toggle('fade-r', list.scrollLeft < max - 1);
}
function updateFades(){ document.querySelectorAll('.ss-tags').forEach(updateFade); }
document.addEventListener('scroll', (e) => { if (e.target.classList && e.target.classList.contains('ss-tags')) updateFade(e.target); }, true);
window.addEventListener('resize', updateFades);
if (document.fonts) document.fonts.ready.then(updateFades);  // 字型載入後寬度會變

SenseShell.mount();

document.getElementById('chips').innerHTML = SenseUI.chips(CATEGORIES, state.cat);

const actions = document.getElementById('list-actions');
actions.innerHTML = SenseUI.listActions({ sorts:SORTS, sort:state.sort, placeholder:'搜尋策略、公司或標籤' });
SenseUI.bindListActions(actions, {
  onQuery: (q) => { state.query = q; state.page = 1; renderList(); },
  onSort:  (k) => { state.sort = k; state.page = 1; renderList(); }
});

document.getElementById('pager').addEventListener('click', (e) => {
  const b = e.target.closest('[data-page]'); if (!b || b.disabled) return;
  state.page = +b.dataset.page; renderList();
  document.getElementById('browse').scrollIntoView({ behavior:'smooth', block:'start' });
});
const grid = document.getElementById('grid');
grid.addEventListener('click', (e) => {
  if (e.target.closest('[data-estimate]')) return SenseShell.notYet('發起媒合預估');
  if (e.target.closest('[data-card]')) SenseShell.notYet('策略詳情頁');
});
grid.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-card]')){ e.preventDefault(); SenseShell.notYet('策略詳情頁'); }
});

/* 標籤列用滑鼠拖曳捲動（觸控與觸控板用原生捲動）；拖過就不觸發卡片點擊 */
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const list = e.target.closest('.ss-tags');
  if (!list || e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = { list, x:e.clientX, left:list.scrollLeft, moved:false };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 4) return;
  drag.moved = true;
  drag.list.classList.add('is-dragging');
  drag.list.scrollLeft = drag.left - dx;
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  drag.list.classList.remove('is-dragging');
  if (drag.moved) document.addEventListener('click', (e) => e.stopPropagation(), { capture:true, once:true });
  drag = null;
});

renderList();
</script>
</body>
</html>
