<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>策略 SENSE</title>
<link rel="icon" type="image/svg+xml" href="shared/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/tokens.css?v=20261028d">
<link rel="stylesheet" href="shared/components.css?v=20261102h">
<link rel="stylesheet" href="shared/forms.css?v=20261028d">
<style>
  /* ── 策略 SENSE 頁內元件：UI Library 尚未收錄，需求確認後再決定是否抽到 shared/ ── */

  /* StrategyCard：策略卡片。照現行畫面：公司＋版本＋認證、標題、說明、適合產業、條件區（標籤＋人數＋價格）、底部交換方式＋CTA */
  .ss-card{display:flex;flex-direction:column;gap:10px;padding:20px;background:var(--white);border:1px solid var(--black-300);border-radius:var(--r-30);cursor:pointer}
  .ss-card:hover,.ss-card:focus-visible{border-color:var(--hover-teal);outline:0}
  .ss-org{display:flex;align-items:center;gap:8px;min-width:0}
  .ss-org .org-name{min-width:0;font-size:14px;font-weight:600;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-800);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ss-org .ver{flex:none;font-size:14px;line-height:20px;color:var(--black-600)}
  .ss-verified{width:16px;height:16px;flex:none;color:var(--badge-blue)}
  .ss-card-title{font-size:16px;font-weight:700;line-height:24px;letter-spacing:var(--tracking-wider);color:var(--black-800);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ss-desc{font-size:14px;line-height:22px;color:var(--black-600)}
  .ss-fit{font-size:13px;line-height:20px;color:var(--accent-border)}

  /* 條件區：灰底圓角，上方條件標籤（打勾），中間分隔線，下方人數與價格 */
  .ss-cond{display:flex;flex-direction:column;gap:10px;padding:14px 16px;background:var(--black-100);border:1px solid var(--black-200);border-radius:var(--r-10)}
  .ss-cond small{font-size:12px;line-height:16px;color:var(--black-500)}
  .ss-cond ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
  .ss-cond li{display:flex;align-items:center;gap:8px;font-size:13px;line-height:20px;color:var(--accent-border)}
  .ss-cond li svg{width:14px;height:14px;flex:none}
  .ss-count{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--black-300);
    font-size:12px;line-height:16px;color:var(--black-500)}
  .ss-count b{font-size:14px;font-weight:500;color:var(--black-700)}
  .ss-count em{font-size:18px;font-style:normal;font-weight:700;color:var(--black-800);margin-right:4px}
  .ss-price{font-size:13px;font-weight:700;line-height:20px;color:var(--accent-border)}

  .ss-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:4px}
  .ss-foot .mode{font-size:13px;line-height:20px;color:var(--black-500)}
</style>
</head>
<body>
<!-- 僅供內部使用，非經許可不得外流。頁面中的公司、策略與數據皆為示意。 -->
<div class="app" data-module="strategy" data-page="home">
  <aside class="sidebar" id="sidebar" aria-label="主選單"></aside>
  <div class="main">
    <header class="header" id="header"></header>

    <main class="content">
      <!-- 區塊：策略列表 -->
      <section class="content-section" aria-labelledby="browse-title">
        <div class="section-title" id="browse">
          <h2 id="browse-title">瀏覽策略</h2>
          <button class="title-btn" data-todo="上架策略"><img src="shared/assets/ic-plus-white.svg" alt=""><span>上架策略</span></button>
        </div>

        <div class="list-toolbar">
          <div class="chips" id="chips" role="group" aria-label="策略分類"></div>
          <div class="list-actions" id="list-actions"></div>
        </div>
        <div class="card-grid" id="grid" aria-live="polite"></div>
        <div class="pager" id="pager"></div>
      </section>
    </main>
  </div>
</div>

<script src="shared/shell.js?v=20261102a"></script>
<script src="shared/components.js?v=20261028d"></script>
<script>
/* ═════════ 示意資料（僅供原型展示） ═════════ */
const ORGS = {
  sf: { name:'股感媒體', mark:'stockfeel' },
  lx: { name:'聯想感', color:'#FFA940' }
};

const CATEGORIES = [ { key:'all', label:'ALL' } ];

// ver 為策略版本；tags 為「同時具備以下全部條件」的會員標籤；price 為每千人費用、min 為最低起價；mode 為交換方式
const STRATEGIES = [
  { id:'s1', org:'sf', ver:'v3 MA', title:'金融理財_郵件', size:200, order:3,
    desc:'需求方付費並於 DCR 內取得標籤；數據方取得分潤、不取得需求方名單。',
    fit:['金融保險', '投資理財', '數位行銷', '證券交易'],
    tags:['金融市場', '投資資訊', '行銷內容'], price:500, min:8000, mode:'單向交換' },
  { id:'s2', org:'lx', ver:'v3', title:'茶飲品牌_郵件', size:10, order:2,
    desc:'需求方付費並於 DCR 內取得標籤；數據方取得分潤、不取得需求方名單。',
    fit:['茶飲產業', '食品飲料', '電子商務', '品牌行銷'],
    tags:['茶飲愛好者', '郵件行銷', '品牌推廣'], price:500, min:8000, mode:'單向交換' },
  { id:'s3', org:'lx', ver:'v3', title:'茶飲品牌_測試2', size:10, order:1,
    desc:'需求方付費並於 DCR 內取得標籤；數據方取得分潤、不取得需求方名單。',
    fit:['飲品業', '餐飲服務', '社交平台', '文化推廣'],
    tags:['茶飲文化', '創新飲品', '社交體驗'], price:500, min:8000, mode:'單向交換' }
];

const SORTS = [
  { key:'newest', label:'最新上架' },
  { key:'size',   label:'符合人數：多到少' }
];
const PER_PAGE = 12;

const VERIFIED = '<svg class="ss-verified" viewBox="0 0 16 16" aria-label="已認證"><path fill="currentColor" d="M8 .8l1.7 1.3 2.1-.2.8 2 1.9 1-.3 2.1L15.2 8 14 9.7l.3 2.1-1.9 1-.8 2-2.1-.2L8 15.2l-1.7-1.3-2.1.2-.8-2-1.9-1 .3-2.1L.8 8 2 6.3 1.7 4.2l1.9-1 .8-2 2.1.2z"/><path d="M5.3 8.2l1.8 1.8 3.6-3.7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5"/></svg>';

/* ═════════ 卡片 ═════════ */
const { esc } = SenseUI;
const num = (n) => n.toLocaleString('en-US');

function strategyCard(s){
  const org = ORGS[s.org];
  return `
    <article class="ss-card" data-card="${s.id}" tabindex="0" aria-label="${esc(s.title)}，${esc(org.name)}">
      <div class="ss-org">${SenseUI.orgLogo(org)}<span class="org-name">${esc(org.name)}</span><span class="ver">(${esc(s.ver)})</span>${VERIFIED}</div>
      <h3 class="ss-card-title" title="${esc(s.title)}">${esc(s.title)}</h3>
      <p class="ss-desc">${esc(s.desc)}</p>
      <p class="ss-fit">適合：${s.fit.map(esc).join('、')}</p>
      <div class="ss-cond">
        <small>同時具備以下全部條件的會員</small>
        <ul>${s.tags.map(t => `<li>${CHECK}#${esc(t)}</li>`).join('')}</ul>
        <div class="ss-count"><span>符合全部條件的人數</span><b><em>${num(s.size)}</em>人</b></div>
        <span class="ss-price">NT$ ${num(s.price)} / 千人・最低起價 NT$ ${num(s.min)}</span>
      </div>
      <div class="ss-foot">
        <span class="mode">${esc(s.mode)}</span>
        <button class="btn btn-primary" data-estimate="${s.id}">發起媒合預估</button>
      </div>
    </article>`;
}

/* ═════════ 狀態與渲染 ═════════ */
const state = { cat:'all', query:'', sort:'newest', page:1 };

function filtered(){
  const q = state.query.toLowerCase();
  const list = STRATEGIES.filter(s => !q || [s.title, ORGS[s.org].name, ...s.fit, ...s.tags].some(t => t.toLowerCase().includes(q)));
  const by = {
    newest: (a, b) => b.order - a.order,
    size:   (a, b) => b.size - a.size
  }[state.sort];
  return list.sort(by);
}

function renderList(){
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  state.page = Math.min(state.page, pages);
  const slice = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);

  document.getElementById('grid').innerHTML = slice.length
    ? slice.map(strategyCard).join('')
    : `<p class="empty" style="grid-column:1/-1">找不到符合「${esc(state.query)}」的策略<br>換個關鍵字試試看</p>`;
  document.getElementById('pager').innerHTML = SenseUI.pagination(state.page, pages);
}

SenseShell.mount();

document.getElementById('chips').innerHTML = SenseUI.chips(CATEGORIES, state.cat);

const actions = document.getElementById('list-actions');
actions.innerHTML = SenseUI.listActions({ sorts:SORTS, sort:state.sort, placeholder:'搜尋策略、公司或標籤' });
SenseUI.bindListActions(actions, {
  onQuery: (q) => { state.query = q; state.page = 1; renderList(); },
  onSort:  (k) => { state.sort = k; state.page = 1; renderList(); }
});

document.getElementById('pager').addEventListener('click', (e) => {
  const b = e.target.closest('[data-page]'); if (!b || b.disabled) return;
  state.page = +b.dataset.page; renderList();
  document.getElementById('browse').scrollIntoView({ behavior:'smooth', block:'start' });
});
const grid = document.getElementById('grid');
grid.addEventListener('click', (e) => {
  if (e.target.closest('[data-estimate]')) return SenseShell.notYet('發起媒合預估');
  if (e.target.closest('[data-card]')) SenseShell.notYet('策略詳情頁');
});
grid.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-card]')){ e.preventDefault(); SenseShell.notYet('策略詳情頁'); }
});

renderList();
</script>
</body>
</html>
