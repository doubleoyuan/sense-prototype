<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行銷 SENSE</title>
<link rel="icon" type="image/svg+xml" href="shared/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/tokens.css?v=20261110a">
<link rel="stylesheet" href="shared/components.css?v=20261110f">
<style>
  /* ── 行銷 SENSE 頁內元件：UI Library 尚未收錄，需求確認後再決定是否抽到 shared/ ── */

  /* AudienceCard：受眾包卡片。外框用共用的 TabCard（.tab-card），右上小頁籤顯示瀏覽數；受眾規模用 .r-card-metrics.compact */
  .ms-tab-views{font-weight:600}  /* 瀏覽數字重比 TabCard 小頁籤預設的 500 粗一階 */
  .ms-tab-views img{width:16px;height:16px;opacity:.6}

  /* 通路表 */
  .ms-channels{width:100%;border-collapse:collapse;font-size:12px;line-height:16px;letter-spacing:var(--tracking-wider);white-space:nowrap}
  .ms-channels th{padding:0 0 8px;font-weight:600;color:var(--black-500);text-align:right;border-bottom:1px solid var(--black-300)}
  .ms-channels th:first-child,.ms-channels td:first-child{text-align:left}
  .ms-channels td{height:41px;padding:0;color:var(--black-700);text-align:right;border-bottom:1px solid var(--line-soft)}
  .ms-channels th + th,.ms-channels td + td{padding-left:12px}
  .ms-channels .ch{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--black-800)}
  .ms-channels .ch i{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--mod-product-tint);color:var(--accent-border)}
  .ms-channels .ch svg{width:14px;height:14px}
  .ms-channels .price{font-weight:700;color:var(--accent-border)}
  .ms-channels tr.off td,.ms-channels tr.off .ch{color:var(--black-400)}
  .ms-channels tr.off .ch i{background:var(--black-100);color:var(--black-400)}

  /* AI 受眾標籤：只顯示一行，超出的左右捲動（觸控直接滑、滑鼠可拖曳），不顯示捲軸 */
  /* AI 圖示固定在最前面，顏色用標籤底色的來源 --mod-finance（比標籤底色深一階）；標籤列在右側捲動，整列貼齊卡片底部 */
  .ms-ai{margin-top:auto;display:flex;align-items:center;gap:8px}
  .ms-ai > svg{width:16px;height:16px;flex:none;color:var(--mod-finance)}
  .ms-tags{flex:1;min-width:0;display:flex;gap:8px;margin:0;padding:0;list-style:none;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;cursor:grab}
  .ms-tags::-webkit-scrollbar{display:none}
  .ms-tags.is-dragging{cursor:grabbing;user-select:none}
  /* 兩側淡出提示還能拖：還有內容的那一側淡出 32px，到底就收起。用遮罩讓標籤本身變透明（black 只代表不透明度），不受底色影響 */
  .ms-tags{--fade-l:0px;--fade-r:0px;
    -webkit-mask-image:linear-gradient(to right,transparent,black var(--fade-l),black calc(100% - var(--fade-r)),transparent);
    mask-image:linear-gradient(to right,transparent,black var(--fade-l),black calc(100% - var(--fade-r)),transparent)}
  .ms-tags.fade-l{--fade-l:32px}
  .ms-tags.fade-r{--fade-r:32px}
  /* 膠囊樣式沿用原本的紫色 AI 標籤，底色改淡黃：由財務模組色 --mod-finance 混白而來（tokens 沒有淡黃） */
  .ms-tags li{flex:none;white-space:nowrap;padding:4px 10px;border-radius:var(--r-16);background:color-mix(in srgb,var(--mod-finance) 30%,var(--white));
    color:var(--black-700);font-size:13px;line-height:20px;letter-spacing:var(--tracking-wider)}
</style>
</head>
<body>
<!-- 僅供內部使用，非經許可不得外流。頁面中的公司、受眾包與數據皆為示意。 -->
<div class="app" data-module="marketing" data-page="home">
  <aside class="sidebar" id="sidebar" aria-label="主選單"></aside>
  <div class="main">
    <header class="header" id="header"></header>

    <main class="content">
      <!-- 區塊：受眾包列表 -->
      <section class="content-section" aria-labelledby="browse-title">
        <div class="section-title" id="browse">
          <h2 id="browse-title">瀏覽受眾包</h2>
          <button class="title-btn" data-todo="上架受眾包"><img src="shared/assets/ic-plus-white.svg" alt=""><span>上架受眾包</span></button>
        </div>

        <div class="list-toolbar">
          <div class="chips" id="chips" role="group" aria-label="受眾包分類"></div>
          <div class="list-actions" id="list-actions"></div>
        </div>
        <div class="card-grid" id="grid" aria-live="polite"></div>
        <div class="pager" id="pager"></div>
      </section>
    </main>
  </div>
</div>

<script src="shared/shell.js?v=20261110a"></script>
<script src="shared/components.js?v=20261028d"></script>
<script>
/* ═════════ 示意資料（僅供原型展示） ═════════ */
const ORGS = {
  sf: { name:'股感媒體科技股份有限公司', mark:'stockfeel' },
  lx: { name:'聯想感', color:'#FFA940' }
};

const CATEGORIES = [ { key:'all', label:'ALL' } ];

// 通路：reach 為 null 表示未提供；price 為每千次費用，null 表示未開放。ai 為 AI 受眾標籤（顯示在卡片底部）；tags 為關鍵字，卡片目前先不顯示
const AUDIENCES = [
  { id:'a1', title:'受眾_20260720143830', org:'sf', views:3, size:602, order:3,
    channels:{ edm:{ reach:385, price:123123 }, sms:{ reach:394, price:123123 }, push:null },
    ai:['新產品愛好者', '互動參與者', '市場擴展潛力'],
    tags:['潛在客戶', '市場擴展', '品牌曝光', '互動潛力', '新產品興趣', '多樣化特徵'] },
  { id:'a2', title:'都會通勤族｜北北基桃地區_簡訊', org:'lx', views:110, size:12, order:2,
    channels:{ edm:{ reach:null, price:100 }, sms:{ reach:null, price:500 }, push:null },
    ai:['效率至上', '科技愛好者', '便利生活追求'],
    tags:['都會生活', '通勤族', '數位行銷', '生活便利', '科技關注', '北北基桃', '效率提升'] },
  { id:'a3', title:'新手父母｜孩童0-3歲_信箱', org:'lx', views:45, size:2, order:1,
    channels:{ edm:{ reach:null, price:800 }, sms:{ reach:null, price:2000 }, push:null },
    ai:['育兒產品狂熱', '家庭生活重視', '資訊需求強烈'],
    tags:['新手父母', '育兒產品', '家庭生活', '孩童成長', '資訊需求', '品牌推廣', '親子活動'] }
];

const CHANNELS = [
  { key:'edm',  label:'EDM', icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/><path d="M2.5 4.5 8 8.5l5.5-4"/></svg>' },
  { key:'sms',  label:'SMS', icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M2.5 3.5h11v7.5H7l-3 2.5V11H2.5z"/><path d="M5.5 7.25h5" stroke-linecap="round"/></svg>' },
  { key:'push', label:'推播', icon:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 11V7.5a4 4 0 0 1 8 0V11l1 1.5H3z"/><path d="M6.75 14h2.5" stroke-linecap="round"/></svg>' }
];
const SPARKLE = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M6 2.5 7.1 5.9 10.5 7 7.1 8.1 6 11.5 4.9 8.1 1.5 7 4.9 5.9z"/><path d="M12 9.5l.6 1.9 1.9.6-1.9.6-.6 1.9-.6-1.9-1.9-.6 1.9-.6z"/><path d="M12 1.5l.45 1.3 1.3.45-1.3.45L12 5l-.45-1.3-1.3-.45 1.3-.45z"/></svg>';

const SORTS = [
  { key:'newest',  label:'最新上架' },
  { key:'size',    label:'受眾規模：大到小' },
  { key:'popular', label:'熱門瀏覽' }
];
const PER_PAGE = 12;

/* ═════════ 卡片 ═════════ */
const { esc } = SenseUI;
const num = (n) => n.toLocaleString('en-US');

function channelRow(c, d){
  if (!d) return `<tr class="off"><td><span class="ch"><i>${c.icon}</i>${c.label}</span></td><td>–</td><td>未開放</td></tr>`;
  return `<tr><td><span class="ch"><i>${c.icon}</i>${c.label}</span></td>
    <td>${d.reach == null ? '未提供' : num(d.reach) + ' 人'}</td>
    <td class="price">NT$ ${num(d.price)}</td></tr>`;
}

function audienceCard(a){
  const org = ORGS[a.org];
  return `
    <article class="tab-card ms-card" data-card="${a.id}" tabindex="0" aria-label="${esc(a.title)}，${esc(org.name)}">
      <div class="tab-card-tabs">
        <div class="tab-card-org" title="${esc(org.name)}">${SenseUI.orgLogo(org)}<span class="org-name">${esc(org.name)}</span></div>
        <div class="tab-card-side ms-tab-views" aria-label="瀏覽數 ${a.views}"><img src="${SenseShell.asset('ic-eye.svg')}" alt="">${SenseUI.compact(a.views)}</div>
      </div>
      <div class="tab-card-body">
        <h3 class="tab-card-title" title="${esc(a.title)}">${esc(a.title)}</h3>
        <span class="r-card-metrics compact"><span class="metric"><small>受眾規模</small><b><em>${num(a.size)}</em> 人</b></span></span>
        <table class="ms-channels">
          <thead><tr><th scope="col">通路</th><th scope="col">可觸及</th><th scope="col">每千次</th></tr></thead>
          <tbody>${CHANNELS.map(c => channelRow(c, a.channels[c.key])).join('')}</tbody>
        </table>
        <div class="ms-ai">${SPARKLE}<ul class="ms-tags" tabindex="0" aria-label="AI 受眾標籤">${a.ai.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>
      </div>
    </article>`;
}

/* ═════════ 狀態與渲染 ═════════ */
const state = { cat:'all', query:'', sort:'newest', page:1 };

function filtered(){
  const q = state.query.toLowerCase();
  const list = AUDIENCES.filter(a => !q || [a.title, ORGS[a.org].name, ...a.ai].some(s => s.toLowerCase().includes(q)));
  const by = {
    newest:  (a, b) => b.order - a.order,
    size:    (a, b) => b.size - a.size,
    popular: (a, b) => b.views - a.views
  }[state.sort];
  return list.sort(by);
}

function renderList(){
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  state.page = Math.min(state.page, pages);
  const slice = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);

  document.getElementById('grid').innerHTML = slice.length
    ? slice.map(audienceCard).join('')
    : `<p class="empty" style="grid-column:1/-1">找不到符合「${esc(state.query)}」的受眾包<br>換個關鍵字試試看</p>`;
  document.getElementById('pager').innerHTML = SenseUI.pagination(state.page, pages);
  updateFades();
}

/* 標籤列兩側淡出：左邊有捲過才淡出左側，右邊還有內容才淡出右側 */
function updateFade(list){
  const max = list.scrollWidth - list.clientWidth;
  list.classList.toggle('fade-l', list.scrollLeft > 1);
  list.classList.toggle('fade-r', list.scrollLeft < max - 1);
}
function updateFades(){ document.querySelectorAll('.ms-tags').forEach(updateFade); }
document.addEventListener('scroll', (e) => { if (e.target.classList && e.target.classList.contains('ms-tags')) updateFade(e.target); }, true);
window.addEventListener('resize', updateFades);
if (document.fonts) document.fonts.ready.then(updateFades);  // 字型載入後寬度會變

SenseShell.mount();

document.getElementById('chips').innerHTML = SenseUI.chips(CATEGORIES, state.cat);

const actions = document.getElementById('list-actions');
actions.innerHTML = SenseUI.listActions({ sorts:SORTS, sort:state.sort, placeholder:'搜尋受眾包、公司或標籤' });
SenseUI.bindListActions(actions, {
  onQuery: (q) => { state.query = q; state.page = 1; renderList(); },
  onSort:  (k) => { state.sort = k; state.page = 1; renderList(); }
});

document.getElementById('pager').addEventListener('click', (e) => {
  const b = e.target.closest('[data-page]'); if (!b || b.disabled) return;
  state.page = +b.dataset.page; renderList();
  document.getElementById('browse').scrollIntoView({ behavior:'smooth', block:'start' });
});
const grid = document.getElementById('grid');
grid.addEventListener('click', (e) => { if (e.target.closest('[data-card]')) SenseShell.notYet('受眾包詳情頁'); });
grid.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-card]')){ e.preventDefault(); SenseShell.notYet('受眾包詳情頁'); }
});

/* 標籤列用滑鼠拖曳捲動（觸控與觸控板用原生捲動）；拖過就不觸發卡片點擊 */
let drag = null;
document.addEventListener('pointerdown', (e) => {
  const list = e.target.closest('.ms-tags');
  if (!list || e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = { list, x:e.clientX, left:list.scrollLeft, moved:false };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) < 4) return;
  drag.moved = true;
  drag.list.classList.add('is-dragging');
  drag.list.scrollLeft = drag.left - dx;
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  drag.list.classList.remove('is-dragging');
  if (drag.moved) document.addEventListener('click', (e) => e.stopPropagation(), { capture:true, once:true });
  drag = null;
});

renderList();
</script>
</body>
</html>
