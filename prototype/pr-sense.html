<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>公關 SENSE</title>
<link rel="icon" type="image/svg+xml" href="shared/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/tokens.css?v=20261016f">
<link rel="stylesheet" href="shared/components.css?v=20261016f">
<link rel="stylesheet" href="shared/forms.css?v=20261016f">
<style>
  /* ── 本頁新增的元件（推導）：UI Library 尚未收錄，確認後再移到 shared/ ── */
  /* 狀態標籤：已報名／開放報名／即將開放、消息／優惠 */
  .status{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:var(--tracking-wider);white-space:nowrap}
  .status.joined{background:var(--accent);color:var(--white)}
  .status.open{background:var(--mod-product-tint);color:var(--accent-border)}
  .status.soon{background:var(--black-100);color:var(--black-500)}
  .status.deal{background:var(--metric-bg);color:#C25E1F}
  .status.news{background:var(--mod-product-tint);color:var(--accent-border)}
  /* 下一場活動：日期方塊＋資訊 */
  .next-event{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:start}
  .date-box{width:72px;padding:8px 0;border-radius:16px;background:var(--ticket);display:flex;flex-direction:column;align-items:center}
  .date-box small{font-size:12px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--black-600)}
  .date-box b{font-size:32px;font-weight:500;font-style:italic;line-height:40px;color:var(--black-800)}
  .next-title{font-size:18px;font-weight:700;line-height:28px;letter-spacing:var(--tracking-super);color:var(--black-800)}
  .meta-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-600)}
  .tip{padding:10px 14px;border-radius:12px;background:var(--step-highlight);font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-700)}
  /* 公司方塊 */
  .co-grid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .co-tile{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:16px;background:var(--white);text-align:left;transition:border-color .15s}
  .co-tile:hover{border-color:var(--hover-teal)}
  .co-tile b{display:block;font-size:14px;font-weight:500;line-height:20px;letter-spacing:1.6px;color:var(--black-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .co-tile small{font-size:12px;line-height:18px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .co-tile > span:last-child{min-width:0}
  /* 俱樂部卡 */
  .club-grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  .club-head{display:flex;align-items:center;gap:12px}
  .club-icon{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--mod-product-tint);color:var(--accent-border);font-size:18px}
  .club-name{font-size:16px;font-weight:700;line-height:24px;letter-spacing:var(--tracking-super)}
  .feed{display:flex;flex-direction:column}
  .feed-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--black-100)}
  .feed-item:last-child{border-bottom:0}
  .feed-item p{font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-800)}
  .feed-item small{font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .verified{width:18px;height:18px;vertical-align:-3px;margin-left:6px}
  .ro-list{margin:0;padding-left:20px;font-size:15px;line-height:26px;letter-spacing:1.6px;color:var(--black-800)}
  .content > section, .content > .content-section{scroll-margin-top:calc(var(--header-h) + 16px)}
  @media (max-width:767px){ .club-grid{grid-template-columns:minmax(0,1fr)} .next-event{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<!-- 僅供內部使用，非經許可不得外流。公關 SENSE 一覽頁，以 UI Library（shared/）重新組裝；舊版（單一檔案）備份於 dist/pr-sense-prototype-20261012-V1.html。公司與活動資料沿用原版示意資料。 -->
<div class="app" data-module="pr" data-page="home">
  <aside class="sidebar" id="sidebar" aria-label="主選單"></aside>
  <div class="main">
    <header class="header" id="header"></header>

    <main class="content">
      <nav class="breadcrumb" aria-label="麵包屑"><span class="root">SENSE</span><span class="sep">/</span><span class="cur" aria-current="page">公關SENSE</span></nav>

      <!-- 模組介紹＋我的統計 -->
      <section class="content-section" aria-labelledby="h-intro">
        <div class="section-title"><h2 id="h-intro">公關 SENSE</h2></div>
        <section class="ticket" aria-label="公關 SENSE 概況">
          <span class="ticket-paper left"></span>
          <div class="ticket-body">
            <div class="ticket-slogan"><h1>認識圈層裡的企業夥伴</h1><p>透過講座、聚會與俱樂部，找到下一個合作機會</p></div>
            <span class="ticket-perf" aria-hidden="true">
              <span class="ticket-notch top"><span><img src="shared/assets/ticket-notch-top.svg" alt=""></span></span>
              <span class="ticket-notch bottom"><span><img src="shared/assets/ticket-notch-bottom.svg" alt=""></span></span>
            </span>
            <div class="ticket-stats">
              <p class="ticket-stat"><b id="st-events">0</b><span>場已參加活動</span></p><hr>
              <p class="ticket-stat"><b id="st-met">0</b><span>家已認識企業</span></p>
            </div>
          </div>
          <span class="ticket-paper right"></span>
          <button class="ticket-close" aria-label="關閉公關 SENSE 概況"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
        </section>
      </section>

      <!-- 我的公司 -->
      <section class="content-section" id="me" aria-labelledby="h-me">
        <div class="section-title"><h2 id="h-me">我的公司</h2></div>
        <div class="form-card form-group review-card" id="me-card"></div>
      </section>

      <!-- 近期活動 -->
      <section class="content-section" id="academy" aria-labelledby="h-academy">
        <div class="section-title"><h2 id="h-academy">近期活動</h2></div>
        <div class="form-card form-group" id="next-event"></div>
        <div class="form-card form-group" aria-label="接下來的場次"><div class="form-group-title"><h2>接下來的場次</h2></div><div style="overflow-x:auto"><table class="ro-table" id="ev-table"></table></div></div>
      </section>

      <!-- 公司名冊 -->
      <section class="content-section" id="directory" aria-labelledby="h-dir">
        <div class="section-title"><h2 id="h-dir">公司名冊</h2></div>
        <p class="field-help">認識 SENSE 平台上的會員企業，依產業找到想合作的夥伴。</p>
        <div class="chips" id="ind-chips" role="group" aria-label="依產業篩選"></div>
        <div class="co-grid" id="co-grid"></div>
      </section>

      <!-- 活動回顧 -->
      <section class="content-section" id="reports" aria-labelledby="h-reports">
        <div class="section-title"><h2 id="h-reports">活動回顧</h2></div>
        <div class="card-grid" id="recap-grid"></div>
        <button type="button" class="add-link" id="more-recaps" data-toast="活動回顧列表頁尚未製作"></button>
      </section>

      <!-- 俱樂部 -->
      <section class="content-section" id="clubs" aria-labelledby="h-clubs">
        <div class="section-title"><h2 id="h-clubs">俱樂部</h2></div>
        <div class="club-grid" id="club-grid"></div>
        <div class="form-card form-group"><div class="form-group-title"><h2>最新消息與優惠</h2></div><div class="feed" id="club-feed"></div></div>
        <button type="button" class="add-link" id="more-clubs"></button>
      </section>
    </main>
  </div>
</div>

<script src="shared/shell.js?v=20261016f"></script>
<script src="shared/components.js?v=20261016f"></script>
<script>
SenseShell.mount();
const esc = SenseUI.esc;

/* ═════════ 示意資料（沿用 pr-sense.html，內部原型用） ═════════ */
const TODAY = '2026-10-16';
const WEEK = ['日','一','二','三','四','五','六'];
const ME = { companyId:'aidai' };
const COMPANIES = [
  { id:'stockfeel', name:'股感媒體科技', short:'股', ind:'金融科技', tint:'#1E40AF' }, { id:'anqian', name:'安錢感', short:'安', ind:'金融科技', tint:'#0F766E' },
  { id:'baoxian', name:'保險感', short:'保', ind:'金融科技', tint:'#3F3AA9' }, { id:'robbins', name:'羅賓斯保代', short:'羅', ind:'金融科技', tint:'#334155' },
  { id:'abc', name:'Asia Bankers Club', short:'A', ind:'金融科技', tint:'#7C2D12' }, { id:'innomy', name:'英諾美生技', short:'英', ind:'大健康', tint:'#C2185B' },
  { id:'aidai', name:'愛戴眼鏡', short:'愛', ind:'零售', tint:'#B45309', brand:'愛戴 iDai' }, { id:'kumi', name:'酷覓星', short:'酷', ind:'零售', tint:'#BE185D' },
  { id:'zocha', name:'摩拓旅程 ZOCHA', short:'Z', ind:'區域經濟', tint:'#1FA67A' }, { id:'lvdian', name:'旅電', short:'旅', ind:'區域經濟', tint:'#0E7490' },
  { id:'lizhang', name:'里長伯', short:'里', ind:'區域經濟', tint:'#65A30D' }, { id:'loop', name:'LOOP', short:'L', ind:'區域經濟', tint:'#0891B2' },
  { id:'juli', name:'硬是愛數據 揪里嗨', short:'揪', ind:'區域經濟', tint:'#EA580C' }, { id:'fanggan', name:'房感不動產科技', short:'房', ind:'房產生活', tint:'#B45309' },
  { id:'jiangren', name:'匠人部落', short:'匠', ind:'房產生活', tint:'#78350F' }, { id:'haiyue', name:'海悅國際', short:'海', ind:'房產生活', tint:'#155E75' },
  { id:'lensense', name:'聯想感', short:'聯', ind:'行銷科技', tint:'#4338CA' }, { id:'shangshu', name:'尚書思鹿', short:'尚', ind:'行銷科技', tint:'#6D28D9' },
  { id:'sfinfo', name:'股感資訊', short:'資', ind:'行銷科技', tint:'#1D4ED8' }, { id:'citizen', name:'市民永續', short:'市', ind:'ESG', tint:'#15803D' },
  { id:'fengcha', name:'奉茶行動', short:'奉', ind:'ESG', tint:'#166534' }, { id:'xingya', name:'星芽', short:'星', ind:'ESG', tint:'#4D7C0F' },
  { id:'chongzi', name:'寵資', short:'寵', ind:'毛孩經濟', tint:'#A16207' }, { id:'golface', name:'綠夾克 Golface', short:'G', ind:'其他', tint:'#14532D' },
  { id:'popworld', name:'popworld', short:'P', ind:'其他', tint:'#DB2777' }, { id:'hele', name:'禾樂映像', short:'禾', ind:'其他', tint:'#525252' }
];
const coById = (id) => COMPANIES.find(c => c.id === id);
const MY_PROFILE = {
  intro:'以會員經營機制驅動回購的眼鏡零售品牌，強調名單再行銷與分眾溝通。',
  facts:['零售', '51–200 人', '北部・南部', '成立 2015'],
  offer:['全台 18 間門市，可作為合作品牌的體驗與取貨據點', '會員 CRM 再行銷實務經驗，可分享分眾溝通做法', '門市活動空間，可承接 20 人以內的小型聚會'],
  need:['大健康產業的異業聯名夥伴', '企業員工福利通路（驗光到府）', '社群聲量與媒體曝光'],
  meet:'企業福委會或人資主管，以及健康檢查、保險相關品牌的行銷負責人。',
  stats:{ events:3, clubs:2, met:18 }
};
const SLOT = { noon:'中午 12:00–14:00', night:'晚上 19:00–21:00', day:'週六 半日' };
const EV_TYPE = { insight:'學院講座', day:'主題式交流聚會' };
const EVENTS = [
  { d:'2026-10-20', slot:'noon',  type:'insight', series:'SENSE INSIGHT 學院 EP04', title:'趨勢判斷｜關稅變局下的佈局抉擇', host:'經濟研究機構 首席經濟學家', cap:40, status:'joined' },
  { d:'2026-11-10', slot:'night', type:'insight', series:'SENSE INSIGHT 學院 EP05', title:'成長策略｜成長停滯時，找出企業的第二條成長曲線', host:'知名零售品牌 行銷長', cap:40, status:'open' },
  { d:'2026-11-21', slot:'day',   type:'day',     series:'SENSE DAY', title:'運動社交日：高爾夫', host:'綠夾克 Golface', cap:32, status:'soon' },
  { d:'2026-12-08', slot:'noon',  type:'insight', series:'SENSE INSIGHT 學院 EP06', title:'資本布局｜併購是捷徑，還是陷阱', host:'會計師事務所 併購諮詢合夥人', cap:40, status:'soon' },
  { d:'2027-01-12', slot:'night', type:'insight', series:'SENSE INSIGHT 學院 EP07', title:'AI 與數據｜資料沉睡，AI 也救不了', host:'國際管理顧問公司 數據策略合夥人', cap:40, status:'soon' }
];
const EV_STATUS = { joined:['joined', '✓ 已報名'], open:['open', '開放報名'], soon:['soon', '即將開放'] };
const RECAPS = [
  { d:'2026-09-19', type:'day', title:'標竿場域參訪：走進生態圈夥伴的第一線', host:'popworld／禾樂映像', photos:24, video:true, g:'linear-gradient(135deg,#FFB080,#FFDD80)' },
  { d:'2026-09-08', type:'insight', title:'數位轉型｜導入新系統前，先問對三個問題', host:'上市科技公司 資訊長', photos:16, video:true, g:'linear-gradient(135deg,#99C7FB,#B6BDFF)' },
  { d:'2026-08-11', type:'insight', title:'品牌經營｜小品牌如何在社群時代被記住', host:'設計顧問公司 創意總監', photos:18, video:true, g:'linear-gradient(135deg,#B6E6E4,#99C7FB)' },
  { d:'2026-07-14', type:'insight', title:'市場展望｜2026 下半年，經營者該關注的五個訊號', host:'投資研究機構 首席分析師', photos:21, video:false, g:'linear-gradient(135deg,#B6BDFF,#FFB080)' }
];
const CLUBS = [
  { id:'martech', name:'MarTech 實務社', type:'需求社', icon:'◎', founder:'lensense', members:8, news:3, deals:1, joined:true },
  { id:'golf', name:'高爾夫社', type:'興趣社', icon:'⛳', founder:'golface', members:11, news:1, deals:2, joined:true },
  { id:'adv', name:'廣告主交流社', type:'需求社', founder:'stockfeel', members:9 }, { id:'sponsor', name:'贊助交流社', type:'需求社', founder:'shangshu', members:6 },
  { id:'nccu', name:'政大校友社', type:'校友社', founder:'stockfeel', members:12 }, { id:'ntu', name:'台大校友社', type:'校友社', founder:'fanggan', members:10 },
  { id:'charity', name:'公益社', type:'興趣社', founder:'citizen', members:7 }
];
const CLUB_FEED = [
  { kind:'deal', co:'golface', club:'golf', at:'2 天前', text:'會員企業包場 9 折，11 月平日適用，可搭配 SENSE DAY 球敘。' },
  { kind:'news', co:'lensense', club:'martech', at:'3 天前', text:'第一方數據應用工作坊 11 月開放社員報名，限 15 家企業。' },
  { kind:'deal', co:'zocha', club:'golf', at:'5 天前', text:'俱樂部成員的員工旅遊租車享 85 折，花東與離島據點適用。' }
];

const fmt = (s) => { const d = new Date(s + 'T00:00:00+08:00'); return { y:d.getFullYear(), m:d.getMonth() + 1, d:d.getDate(), w:WEEK[d.getDay()] }; };
const VERIFIED = '<svg class="verified" viewBox="0 0 24 24" role="img" aria-label="已認證商家"><circle cx="12" cy="12" r="12" fill="#4DB8EE"/><path d="M6.8 12.4l3.4 3.4 7-7.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="square"/></svg>';
const status = (k) => `<span class="status ${EV_STATUS[k][0]}">${EV_STATUS[k][1]}</span>`;
const item = (label, html, wide) => `<div class="ro-item${wide ? ' span-2' : ''}"><span class="ro-label">${label}</span>${html}</div>`;

/* ═════════ 票券統計 ═════════ */
document.getElementById('st-events').textContent = MY_PROFILE.stats.events;
document.getElementById('st-met').textContent = MY_PROFILE.stats.met;

/* ═════════ 我的公司（唯讀卡片） ═════════ */
const me = coById(ME.companyId), P = MY_PROFILE;
document.getElementById('me-card').innerHTML = `
  <div class="form-group-title"><h2>${esc(me.name)}${VERIFIED}</h2><button type="button" class="edit-link" data-toast="公司資料編輯頁尚未製作">編輯</button></div>
  <div class="ro-grid">
    ${item('公司簡介', `<p class="ro-value">${esc(P.intro)}</p>`, true)}
    ${item('公司屬性', `<div class="ro-chips">${P.facts.map(f => `<span>${esc(f)}</span>`).join('')}</div>`, true)}
    ${item('我能提供', `<ul class="ro-list">${P.offer.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`)}
    ${item('我需要', `<ul class="ro-list">${P.need.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`)}
    ${item('想認識', `<p class="ro-value">${esc(P.meet)}</p>`, true)}
  </div>`;

/* ═════════ 近期活動 ═════════ */
const upcoming = EVENTS.filter(e => e.d >= TODAY);
const nx = upcoming[0], n = fmt(nx.d);
document.getElementById('next-event').innerHTML = `
  <div class="form-group-title"><h2>下一場活動</h2></div>
  <div class="next-event">
    <div class="date-box"><small>${n.m} 月</small><b>${n.d}</b><small>週${n.w}</small></div>
    <div class="stack" style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <div class="meta-line"><span class="status open">${EV_TYPE[nx.type]}</span><span>${esc(nx.series)}</span></div>
      <h3 class="next-title">${esc(nx.title)}</h3>
      <div class="meta-line"><span>時間：${SLOT[nx.slot]}</span><span>講者：${esc(nx.host)}</span><span>名額 ${nx.cap} 人</span>${status(nx.status)}</div>
      ${nx.status === 'joined' ? '<p class="tip">行前提醒：講後開放會員交流，歡迎提前準備想認識的對象。</p>' : ''}
      <div><button type="button" class="btn btn-primary" data-toast="活動詳情頁尚未製作">活動詳情</button></div>
    </div>
  </div>`;
document.getElementById('ev-table').innerHTML = `<thead><tr><th>日期</th><th>活動</th><th>類型</th><th>狀態</th></tr></thead><tbody>${
  upcoming.slice(1).map(e => { const f = fmt(e.d); return `<tr><td style="white-space:nowrap">${f.m}/${f.d}（${f.w}）</td><td>${esc(e.title)}<br><small style="color:var(--black-500)">${esc(e.host)}</small></td><td style="white-space:nowrap">${EV_TYPE[e.type]}</td><td>${status(e.status)}</td></tr>`; }).join('')}</tbody>`;

/* ═════════ 公司名冊：依產業篩選 ═════════ */
const INDS = ['全部', ...new Set(COMPANIES.map(c => c.ind))].sort((a, b) => (a === '全部' ? -1 : b === '全部' ? 1 : (a === '其他') - (b === '其他')));
let ind = '全部';
const chipsEl = document.getElementById('ind-chips');
const drawDir = () => {
  chipsEl.innerHTML = SenseUI.chips(INDS.map(k => ({ key:k, label:k })), ind);
  const list = COMPANIES.filter(c => c.id !== ME.companyId && (ind === '全部' || c.ind === ind));
  document.getElementById('co-grid').innerHTML = list.map(c => `
    <button type="button" class="co-tile" data-toast="${esc(c.name)} 的公司頁尚未製作">
      ${SenseUI.orgLogo({ name:c.short, color:c.tint })}<span><b>${esc(c.name)}</b><small>${esc(c.ind)}</small></span>
    </button>`).join('');
};
chipsEl.addEventListener('click', (e) => { const b = e.target.closest('[data-chip]'); if (b){ ind = b.dataset.chip; drawDir(); } });
drawDir();

/* ═════════ 活動回顧：沿用商品卡元件，主圖用漸層示意 ═════════ */
// 只放最近 3 場，剛好排滿一列；其餘從「查看所有回顧」進入
document.getElementById('more-recaps').textContent = `查看所有回顧（共 ${RECAPS.length} 場）`;
document.getElementById('recap-grid').innerHTML = RECAPS.slice(0, 3).map((r, i) => { const f = fmt(r.d);
  return SenseUI.resourceCard({ id:'r' + i, title:r.title, org:{ name:r.host, color:'#9E9E9E' },
    metrics:[{ label:'日期', value:`${f.y}/${f.m}/${f.d}` }, { label:r.video ? '照片・影片' : '照片', value:`${r.photos} 張${r.video ? '＋精華' : ''}` }] })
    .replace('<span class="r-card-img"></span>', `<span class="r-card-img" style="background:${r.g}"></span>`); }).join('');
document.getElementById('recap-grid').addEventListener('click', (e) => { if (e.target.closest('[data-card]')) SenseShell.toast('活動回顧詳情尚未製作'); });

/* ═════════ 俱樂部 ═════════ */
const mine = CLUBS.filter(c => c.joined), others = CLUBS.filter(c => !c.joined);
document.getElementById('club-grid').innerHTML = mine.map(c => `
  <section class="form-card form-group" aria-label="${esc(c.name)}">
    <div class="club-head"><span class="club-icon" aria-hidden="true">${c.icon}</span><div style="flex:1;min-width:0"><div class="club-name">${esc(c.name)}</div><span class="field-help">${c.members} 家成員・發起：${esc(coById(c.founder).name)}</span></div></div>
    <div class="ro-chips"><span>${c.type}</span></div>
    <div class="meta-line"><span class="status news">新消息 ${c.news}</span><span class="status deal">新優惠 ${c.deals}</span></div>
  </section>`).join('');
document.getElementById('club-feed').innerHTML = CLUB_FEED.map(f => { const c = coById(f.co), cl = CLUBS.find(x => x.id === f.club);
  return `<div class="feed-item"><span class="status ${f.kind}">${f.kind === 'deal' ? '優惠' : '消息'}</span><div><p><b>${esc(c.name)}</b>　${esc(f.text)}</p><small>${esc(cl.name)}・${f.at}</small></div></div>`; }).join('');
const moreClubs = document.getElementById('more-clubs');
moreClubs.textContent = `還有 ${others.length} 個俱樂部可以加入`;
moreClubs.dataset.toast = '俱樂部列表頁尚未製作';

// 頁面上的 data-toast 由 shell.js 統一處理
</script>
</body>
</html>
