<style>
  /* ── SENSE Design System tokens（沿用 datamart／公關原型） ── */
  :root{
    color-scheme: light;
    --page:#F5F7FB; --surface:#FFFFFF; --subtle:#F6F8FD;
    --border:#E8EBF3; --border-strong:#DFDFDF;
    --text:#2C2C2C; --text-2:#56575B; --text-3:#8A8B90;
    --brand:#49BFBB; --brand-50:#EDFFFF;
    /* 模組識別色 */
    --mk:#49BFBB; --pd:#E0912A; --st:#3F3AA9; --ai:#9AA0A6;
    --tf:#1E88A8; --fin:#B8860B;
    --pr:#B33A29; --pr-600:#9A2E20; --pr-700:#7E2A20; --pr-50:#FBEDEB; --pr-100:#F6D9D4;
    --danger:#FF4D4F; --success:#1E8F17;
    --radius-sm:4px; --radius-md:8px; --radius-pill:999px;
    --shadow-md:0 6px 20px rgba(28,44,60,.10);
    --sidebar-w:240px; --header-h:56px;
    --font:"Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,p{margin:0}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}

  /* ── App shell ── */
  .app{display:flex;min-height:100vh}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}

  /* ── Sidebar（依 Figma：Sense - Master File · node 4004:3719） ── */
  .sidebar{width:320px;max-width:86vw;flex:none;background:#EEEEEE;position:sticky;top:0;height:100vh;overflow-y:auto;
    padding:20px;display:flex;flex-direction:column;gap:20px;z-index:40;
    font-family:"Roboto Condensed",var(--font);color:#424242;letter-spacing:3.2px}
  .sidebar button{font-family:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;text-align:left}
  .sidebar button:focus-visible{outline:2px solid #4C56C9;outline-offset:2px;border-radius:4px}
  .sb-card{background:#fff;border-radius:20px;padding:10px 20px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:20px;flex:none}

  /* Logo */
  .sb-logo{display:flex;align-items:center}
  .sb-logo-mark{position:relative;width:40px;height:40px;overflow:hidden;flex:none}
  .sb-logo-mark img{position:absolute;left:25%;top:9.38%;width:50%;height:82.36%;display:block}
  .sb-wordmark{font-size:24px;font-weight:600;line-height:24px;letter-spacing:3.2px;
    background:linear-gradient(90deg,#0073F5 3.85%,#42D6CD 34.82%,#FABF32 69.95%,#FF5024 99.99%);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  /* 主按鈕：找商務合作 */
  .sidebar .sb-cta{position:relative;display:flex;align-items:center;gap:40px;padding:10px 20px;border:2px solid #FF6100;border-radius:40px;
    background:#FF6100;filter:drop-shadow(0 2px 0 #EEEEEE);transition:filter .15s}
  .sidebar .sb-cta:hover{filter:drop-shadow(0 2px 0 #EEEEEE) brightness(1.05)}
  .sb-cta .cta-bg{position:absolute;left:0;top:0;width:90px;height:44px;display:block}
  .sb-cta .cta-line{position:absolute;left:73px;top:0;width:133px;height:44px;display:block;transform:rotate(180deg)}
  .sb-cta .cta-icon{position:relative;display:flex;align-items:center;padding:0 10px}
  .sb-cta .cta-icon span{position:relative;width:24px;height:24px;display:block}
  .sb-cta .cta-icon img{position:absolute;left:0;top:0;width:24px;height:28px;display:block}
  .sb-cta .cta-text{position:relative;color:#fff;font-size:14px;font-weight:600;line-height:24px;white-space:nowrap}

  /* 模組卡片 */
  .sb-mod{width:100%;border:1px solid #EEEEEE;border-radius:10px;box-shadow:0 1px 0 0 #EEEEEE;padding:10px 20px;
    display:flex;flex-direction:column;gap:10px;background:#fff;transition:background .15s}
  .sb-mod-head{display:flex;align-items:center;gap:10px;min-height:24px}
  .sb-blocker{width:4px;align-self:stretch;min-height:24px;background:var(--c);flex:none}
  .sidebar .sb-mod-label{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:24px;color:#424242}
  .sidebar .sb-chev{width:32px;height:32px;margin:-4px;display:grid;place-items:center;flex:none;border-radius:6px}
  .sidebar .sb-chev:hover{background:#F5F5F5}
  .sb-chev img{width:24px;height:24px;display:block}
  .sb-mod.inert{cursor:pointer}
  .sb-mod.inert:hover{background:#FAFAFA}
  .sb-mod.is-current .sb-mod-label{color:#4C56C9}
  .sb-sub{display:flex;flex-direction:column;gap:10px;width:100%}
  .sidebar .sb-sub-item{width:100%;padding:0 10px}
  .sb-sub-item span{display:block;padding:0 10px;border-bottom:1px solid #EEEEEE;font-size:14px;font-weight:400;line-height:24px;white-space:nowrap;transition:color .15s,border-color .15s}
  .sb-sub-item:hover span{color:#4C56C9}
  .sb-sub-item.active span{color:#4C56C9;font-weight:600;border-bottom-color:#B6BDFF}

  /* 分區標題（我的專屬內容／後台管理） */
  .sb-sec{position:relative;width:100%;height:28px;display:flex;gap:4px;flex:none}
  .sb-sec::before{content:"";width:4px;border-radius:1px;background:var(--c);flex:none}
  .sb-sec span{flex:1;min-width:0;background:var(--c);border-radius:1px;padding:0 10px;display:flex;align-items:center;
    color:#fff;font-size:14px;font-weight:600;line-height:24px}
  .sb-sec img{position:absolute;right:0;top:0;width:9px;height:28px;display:block}
  .sidebar .sb-link{width:100%;padding:0 0 4px 10px;border-bottom:1px solid var(--line);font-size:12px;font-weight:500;line-height:24px;transition:color .15s,border-color .15s}
  .sidebar .sb-link:hover{color:var(--strong)}
  .sidebar .sb-link.active{color:var(--strong);font-weight:600;border-bottom-color:var(--c)}

  /* 使用者 */
  .sb-user{background:#fff;border-radius:20px;padding:20px;display:flex;align-items:center;gap:20px;flex:none}
  .sb-user-info{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
  .sb-user-name{font-size:12px;font-weight:500;line-height:24px}
  .sb-badge{background:#4DB8EE;border-radius:30px;padding:0 10px;color:#fff;font-size:10px;font-weight:600;letter-spacing:.8px;line-height:20px;white-space:nowrap}
  .sidebar .sb-logout{border:1px solid #EEEEEE;border-radius:10px;box-shadow:0 1px 0 0 #EEEEEE;padding:0 20px;background:#fff;font-size:12px;font-weight:500;line-height:24px;white-space:nowrap}
  .sidebar .sb-logout:hover{background:#FAFAFA}

  /* ── Header（只留 breadcrumb、搜尋、通知） ── */
  .header{position:sticky;top:0;z-index:30;height:64px;background:#fff;border-bottom:1px solid #EEEEEE;
    display:flex;align-items:center;gap:16px;padding:0 32px;font-family:"Roboto Condensed",var(--font)}
  .hamburger{display:none;width:36px;height:36px;border:1px solid #EEEEEE;border-radius:10px;background:#fff;align-items:center;justify-content:center;color:#424242}
  .crumbs{display:flex;align-items:center;gap:8px;flex:1;min-width:0;font-size:13px;letter-spacing:1px;color:#9E9E9E;white-space:nowrap;overflow:hidden}
  .crumbs .sep{color:#D6D6D6}
  .crumbs .cur{color:#424242;font-weight:600}
  .crumbs button{border:0;background:none;padding:0;font:inherit;letter-spacing:inherit;color:inherit}
  .crumbs button:hover{color:#4C56C9}
  .search{display:flex;align-items:center;gap:8px;width:300px;background:#FAFAFA;border:1px solid #EEEEEE;border-radius:10px;padding:8px 12px;color:#9E9E9E}
  .search:focus-within{border-color:#B6BDFF;background:#fff}
  .search input{border:0;outline:0;background:transparent;font-size:13px;flex:1;min-width:0;color:#424242}
  .search svg{width:16px;height:16px;flex:none}
  .icon-btn{position:relative;width:38px;height:38px;border:1px solid #EEEEEE;border-radius:10px;background:#fff;color:#616161;display:inline-grid;place-items:center;flex:none}
  .icon-btn:hover{background:#FAFAFA}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn .ping{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#FF6100;box-shadow:0 0 0 2px #fff}

  /* ── Content（白底） ── */
  .main{background:#fff}
  .content{padding:32px;max-width:1280px;width:100%;margin:0 auto}
  .page-head h1{font-size:22px;font-weight:900;letter-spacing:.01em}
  .page-head p{margin-top:4px;color:var(--text-2);font-size:13.5px}
  .placeholder{margin-top:20px;background:var(--surface);border:1px dashed #D5D8E2;border-radius:var(--radius-md);
    min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:32px;color:var(--text-3)}
  .placeholder .ph-icon{width:44px;height:44px;border-radius:12px;background:var(--pr-50);color:var(--pr);display:grid;place-items:center}
  .placeholder .ph-icon svg{width:22px;height:22px}
  .placeholder b{color:var(--text-2);font-size:14px}
  .placeholder .src{font-size:12px;background:var(--subtle);border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px 10px}

  /* ── 公關 SENSE 一覽 ── */
  .ov{--ink:#424242;--ink-2:#6B6B6B;--ink-3:#9E9E9E;--line:#EEEEEE;--prc:#B6BDFF;--prs:#4C56C9;--prsoft:#F4F5FF;--teal:#2E8F8B;--teal-soft:#E8F6F5;
    color:var(--ink)}
  .ov .num{font-family:"Roboto Condensed",var(--font);font-variant-numeric:tabular-nums}
  .ov-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .ov-eyebrow{display:flex;align-items:center;gap:10px;font-family:"Roboto Condensed",var(--font);font-size:12px;font-weight:600;letter-spacing:3.2px;color:var(--prs)}
  .ov-eyebrow::before{content:"";width:4px;height:16px;background:var(--prc)}
  .ov-head h1{font-size:26px;font-weight:900;letter-spacing:2px;margin-top:6px}
  .ov-head p{margin-top:4px;color:var(--ink-2);font-size:14px}

  .ov-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px}
  .ov-card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 0 0 var(--line);padding:24px;min-width:0;display:flex;flex-direction:column;gap:18px}
  .span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
  .card-h{display:flex;align-items:center;gap:10px}
  .card-h::before{content:"";width:4px;height:20px;background:var(--prc);flex:none}
  .card-h h2{flex:1;font-size:17px;font-weight:700;letter-spacing:2px}
  .card-h small{font-size:12px;color:var(--ink-3);font-weight:400;letter-spacing:.5px;margin-left:8px}
  .more{border:0;background:none;padding:4px 0;font-size:13px;color:var(--prs);font-weight:600;letter-spacing:1px;white-space:nowrap}
  .more:hover{text-decoration:underline;text-underline-offset:3px}
  .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;line-height:20px;color:var(--ink-2);background:#fff;white-space:nowrap}
  .chip.pr{border-color:var(--prc);color:var(--prs);background:var(--prsoft)}
  .chip.pr-solid{border-color:var(--prs);background:var(--prs);color:#fff}
  .chip.teal{border-color:#BFE6E4;color:var(--teal);background:var(--teal-soft)}
  .chip.gray{background:#F5F5F5;color:var(--ink-2)}
  .chip.orange{border-color:#FFD2B3;color:#C24A00;background:#FFF4EC}
  .logo-sq{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none;letter-spacing:0}
  .btn2{border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:0 1px 0 0 var(--line);padding:7px 16px;font-size:13px;font-weight:600;color:var(--ink);letter-spacing:1px;white-space:nowrap}
  .btn2:hover{background:#FAFAFA}
  .btn2.primary{background:var(--prs);border-color:var(--prs);color:#fff;box-shadow:none}
  .btn2.primary:hover{filter:brightness(1.08);background:var(--prs)}

  /* ① 我的公司 */
  .me-card{flex-direction:row;gap:28px;padding:28px;background:linear-gradient(120deg,#fff 55%,var(--prsoft))}
  .me-id{flex:0 0 340px;display:flex;flex-direction:column;gap:14px;min-width:0}
  .me-top{display:flex;gap:14px;align-items:center}
  .me-top .logo-sq{width:64px;height:64px;border-radius:16px;font-size:20px}
  .me-name{font-size:22px;font-weight:900;letter-spacing:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .me-brand{font-size:13px;color:var(--ink-3);margin-top:2px;letter-spacing:1px}
  .verified{width:20px;height:20px;flex:none;display:block}
  .me-intro{font-size:14px;color:var(--ink-2);line-height:1.7}
  .me-facts{display:flex;gap:6px;flex-wrap:wrap}
  .me-stats{display:flex;gap:24px;padding-top:14px;border-top:1px solid var(--line);margin-top:auto}
  .me-stats div{font-size:12px;color:var(--ink-3);letter-spacing:1px}
  .me-stats b{display:block;font-size:22px;color:var(--ink);font-weight:600;letter-spacing:0}
  .me-res{flex:1;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .res-col{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
  .res-col h3{font-size:13px;font-weight:700;letter-spacing:2px;display:flex;align-items:center;gap:8px}
  .res-col h3 i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
  .res-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .res-col li{font-size:13.5px;line-height:1.5;padding-left:12px;position:relative}
  .res-col li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--ink-3)}
  .res-col p{font-size:13.5px;line-height:1.6;color:var(--ink)}
  .me-actions{display:flex;gap:8px;justify-content:flex-end;grid-column:1/-1}

  /* ② 學院講座 */
  .ac-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
  .next{border-radius:16px;background:var(--prsoft);border:1px solid #E3E6FF;padding:20px;display:flex;flex-direction:column;gap:12px}
  .next-when{display:flex;align-items:center;gap:14px}
  .datebox{width:58px;border-radius:12px;background:#fff;border:1px solid #E3E6FF;text-align:center;padding:6px 0;flex:none}
  .datebox small{display:block;font-size:11px;color:var(--prs);font-weight:600;letter-spacing:1px}
  .datebox b{display:block;font-size:24px;line-height:1.1;font-weight:600}
  .next h3{font-size:17px;font-weight:700;line-height:1.45;letter-spacing:.5px}
  .next-meta{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
  .seat{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2)}
  .seat-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .seat-bar{height:6px;border-radius:3px;background:#fff;overflow:hidden}
  .seat-bar i{display:block;height:100%;border-radius:3px;background:var(--prs)}
  .next-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:auto}
  .tip{display:flex;gap:8px;font-size:12.5px;line-height:1.6;color:var(--ink-2);background:#fff;border-radius:10px;padding:10px 12px}
  .tip b{color:var(--ink);font-weight:600}
  .ev-list{display:flex;flex-direction:column}
  .ev-month{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:2px;padding:4px 0 6px}
  .ev-month:not(:first-child){margin-top:10px}
  .ev-row{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);border-left:0;border-right:0;border-top:0;background:none;text-align:left;width:100%;border-radius:0}
  .ev-row:hover{background:#FAFAFA}
  .ev-d{font-size:15px;font-weight:600;line-height:1.1}
  .ev-d small{display:block;font-size:11px;color:var(--ink-3);font-weight:400;letter-spacing:1px}
  .ev-t{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev-s{font-size:12px;color:var(--ink-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ③ 公司名冊 */
  .dir-hero{display:flex;align-items:baseline;gap:10px}
  .dir-hero b{font-size:40px;font-weight:600;line-height:1}
  .dir-hero span{font-size:13px;color:var(--ink-2)}
  .ind{display:flex;flex-direction:column;gap:7px}
  .ind-row{display:grid;grid-template-columns:64px minmax(0,1fr) 22px;gap:10px;align-items:center;font-size:12px;color:var(--ink-2)}
  .ind-row .track{height:8px}
  .ind-row .track i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--prc)}
  .ind-row:hover .track i{background:#8E98F5}
  .ind-row .n{text-align:right;color:var(--ink)}
  .sub-h{font-size:12px;font-weight:700;color:var(--ink-3);letter-spacing:2px}
  .co-row{display:flex;align-items:center;gap:12px;padding:8px 4px;border:0;background:none;width:100%;text-align:left;border-radius:10px}
  .co-row:hover{background:#FAFAFA}
  .co-row .logo-sq{width:36px;height:36px;font-size:12px}
  .co-row b{display:block;font-size:14px;font-weight:600}
  .co-row small{font-size:12px;color:var(--ink-3)}

  /* ④ 活動效益報告 */
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .kpi{border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .kpi span{display:block;font-size:12px;color:var(--ink-3);letter-spacing:1px}
  .kpi b{display:block;font-size:28px;font-weight:600;line-height:1.2;margin-top:4px}
  .kpi b small{font-size:13px;color:var(--ink-2);font-weight:400;margin-left:3px}
  .report{border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 20px;align-items:center}
  .report h3{font-size:16px;font-weight:700;letter-spacing:.5px;margin-top:6px}
  .report .r-meta{font-size:12px;color:var(--ink-3);letter-spacing:.5px}
  .report .r-quote{grid-column:1/-1;font-size:13.5px;color:var(--ink-2);line-height:1.7;background:#FAFAFA;border-radius:10px;padding:12px 14px}
  .r-stats{grid-column:1/-1;display:flex;gap:24px;flex-wrap:wrap}
  .r-stats div{font-size:12px;color:var(--ink-3);letter-spacing:.5px}
  .r-stats b{font-size:18px;color:var(--ink);font-weight:600;margin-right:3px}
  .r-older{display:flex;flex-direction:column}
  .r-older button{display:flex;align-items:center;gap:12px;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px;text-align:left;font-size:13px;width:100%}
  .r-older button:hover{background:#FAFAFA}
  .r-older .d{width:44px;color:var(--ink-3);flex:none}
  .r-older .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .r-older .m{color:var(--ink-2);font-size:12px;white-space:nowrap}

  /* ⑤ 俱樂部 */
  .club{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;background:#fff;width:100%}
  .club:hover{border-color:var(--prc)}
  .club-top{display:flex;align-items:center;gap:12px}
  .club-ic{width:40px;height:40px;border-radius:12px;background:var(--prsoft);color:var(--prs);display:grid;place-items:center;flex:none;font-size:18px}
  .club-top b{display:block;font-size:15px;font-weight:700;letter-spacing:1px}
  .club-top small{font-size:12px;color:var(--ink-3)}
  .club-reach{font-size:12px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap}
  .club-reach b{color:var(--ink);font-weight:600}
  .club-new{display:flex;gap:6px}
  .feed{display:flex;flex-direction:column}
  .feed-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .feed-item > .chip{align-self:start;margin-top:1px}
  .feed-item p{font-size:13.5px;line-height:1.55}
  .feed-item small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}

  @media (max-width:1180px){
    .me-card{flex-direction:column}
    .me-id{flex:none}
    .span-8,.span-7,.span-5,.span-4{grid-column:span 12}
  }
  @media (max-width:720px){
    .me-res,.ac-body{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .content{padding:20px 16px}
    .ov-card{padding:18px}
  }

  /* ── Toast ── */
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
    background:#2C2C2C;color:#fff;font-size:13px;padding:9px 16px;border-radius:6px;box-shadow:var(--shadow-md);transition:all .2s;z-index:100}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ── Responsive ── */
  .backdrop{display:none}
  @media (max-width:1080px){ .search{display:none} }
  @media (max-width:900px){
    .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-md)}
    .app.nav-open .sidebar{transform:none}
    .app.nav-open .backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:35}
    .hamburger{display:inline-flex}
    .header{padding:0 16px;gap:12px}
    .content{padding:16px}
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ═════════ Sidebar ═════════ -->
  <aside class="sidebar" id="sidebar" aria-label="主選單">
    <nav class="sb-card" id="nav"></nav>
    <div class="sb-user">
      <div class="sb-user-info">
        <span class="sb-user-name" id="sb-user-name"></span>
        <span class="sb-badge">已認證商家</span>
      </div>
      <button class="sb-logout" data-toast="原型不提供登出">登出</button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- ═════════ Main ═════════ -->
  <div class="main">
    <header class="header">
      <button class="hamburger" id="hamburger" aria-label="開啟選單">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="crumbs" id="crumbs"></div>

      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg>
        <input placeholder="搜尋公司、講座、報告、俱樂部…" aria-label="搜尋">
      </label>
      <button class="icon-btn" aria-label="通知" data-toast="通知中心尚未規劃">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="ping"></span>
      </button>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═════════ Icons ═════════ */
const ICON = {
  home:'M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
  calendar:'M4 5h16v16H4zM4 9h16M8 3v4M16 3v4',
  users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75',
  handshake:'M7 4v16 M3 8l4-4 4 4 M17 20V4 M13 16l4 4 4-4',
  chat:'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
  star:'M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z',
  ticket:'M3 8a2 2 0 0 0 0 4v4h18v-4a2 2 0 0 0 0-4V4H3z M13 4v16',

/* ═════════ Render: Sidebar ═════════ */
function renderSidebar(){
  document.getElementById('sb-user-name').textContent = ME.name;

  const inertMod = m => `
    <div class="sb-mod inert" data-inert role="button" tabindex="0" aria-disabled="true">
      <div class="sb-mod-head">
        <span class="sb-blocker" style="--c:${m.c}"></span>
        <span class="sb-mod-label">${m.label}</span>
        <span class="sb-chev"><img src="${ASSET.chevDown}" alt=""></span>
      </div>
    </div>`;

  let h = `
    <button class="sb-logo" data-pr-home aria-label="SENSE 首頁">
      <span class="sb-logo-mark"><img src="${ASSET.illustration}" alt=""></span>
      <span class="sb-wordmark">SENSE</span>
    </button>
    <button class="sb-cta" data-inert>
      <img class="cta-bg" src="${ASSET.whiteBackground}" alt="">
      <img class="cta-line" src="${ASSET.whiteLine}" alt="">
      <span class="cta-icon"><span><img src="${ASSET.ionic}" alt=""></span></span>
      <span class="cta-text">找商務合作</span>
    </button>`;

  h += OTHER_MODULES_BEFORE.map(inertMod).join('');

  // 公關 SENSE：點文字 → 進一覽並展開；點箭頭 → 只展開／收合
  const subs = Object.entries(PAGES).filter(([,p]) => p.group==='pr' && p.sub);
  h += `
    <div class="sb-mod${state.route==='overview'?' is-current':''}">
      <div class="sb-mod-head">
        <span class="sb-blocker" style="--c:#B6BDFF"></span>
        <button class="sb-mod-label" data-pr-home aria-current="${state.route==='overview'?'page':'false'}">公關SENSE</button>
        <button class="sb-chev" data-toggle-pr aria-expanded="${state.prOpen}" aria-controls="pr-sub" aria-label="${state.prOpen?'收合':'展開'}公關 SENSE">
          <img src="${state.prOpen?ASSET.chevUp:ASSET.chevDown}" alt="">
        </button>
      </div>
      <div class="sb-sub" id="pr-sub"${state.prOpen?'':' hidden'}>
        ${subs.map(([k,p]) => `<button class="sb-sub-item${state.route===k?' active':''}" data-go="${k}"${state.route===k?' aria-current="page"':''}><span>${p.label}</span></button>`).join('')}
      </div>
    </div>`;

  h += OTHER_MODULES_AFTER.map(inertMod).join('');

  SECTIONS.forEach(s => {
    h += `<div class="sb-sec" style="--c:${s.c}"><span>${GROUP_LABEL[s.group]}</span><img src="${ASSET.secMask}" alt=""></div>`;
    Object.entries(PAGES).filter(([,p]) => p.group===s.group).forEach(([k,p]) => {
      h += `<button class="sb-link${state.route===k?' active':''}" style="--c:${s.c};--line:${s.line};--strong:${s.strong}" data-go="${k}"${state.route===k?' aria-current="page"':''}>${p.label}</button>`;
    });
  });

  document.getElementById('nav').innerHTML = h;
}

/* ═════════ Render: Header ═════════ */
function renderHeader(){
  const p = PAGES[state.route];
  // 公關 SENSE 的上層可點回一覽；我的專屬內容／後台管理沒有上層頁面
  const root = p.group==='pr' && state.route!=='overview'
    ? `<button data-pr-home>${GROUP_LABEL.pr}</button>` : `<span>${GROUP_LABEL[p.group]}</span>`;
  document.getElementById('crumbs').innerHTML = `${root}<span class="sep">/</span><span class="cur">${p.label}</span>`;
}

/* ═════════ 一覽頁 ═════════ */
const fmtMD = s => { const d = new Date(s+'T00:00:00+08:00'); return { m:d.getMonth()+1, d:d.getDate(), w:WEEK[d.getDay()], md:`${d.getMonth()+1}/${d.getDate()}` }; };
const daysFrom = s => Math.round((new Date(s+'T00:00:00+08:00') - new Date(TODAY+'T00:00:00+08:00')) / 864e5);
/* 認證標記：藍勾勾（顏色沿用 Figma「已認證商家」標籤 #4DB8EE） */
const VERIFIED = `<svg class="verified" viewBox="0 0 24 24" role="img" aria-label="已認證商家"><title>已認證商家</title><circle cx="12" cy="12" r="12" fill="#4DB8EE"/><path d="M6.8 12.4l3.4 3.4 7-7.2" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="square"/></svg>`;
const chip = (cls, t) => `<span class="chip ${cls}">${t}</span>`;
const logo = c => `<span class="logo-sq" style="background:${c.tint}" aria-hidden="true">${c.short}</span>`;
const cardHead = (title, sub, route, more) =>
  `<div class="card-h"><h2>${title}${sub?`<small>${sub}</small>`:''}</h2><button class="more" data-go="${route}">${more} →</button></div>`;

function renderOverview(){
  const me = coById(ME.companyId);

  /* ① 我的公司 */

  /* ② 學院講座：下一場＋本月、下個月 */

  const months = [10, 11];
  const listEv = months.map(m => {

    if (!evs.length) return '';
    return `<div class="ev-month">${m} 月</div>` + evs.map(e => { const f = fmtMD(e.d), st = EV_STATUS[e.status];
      return `<button class="ev-row" data-go="academy">
        <span class="ev-d num">${f.md}<small>週${f.w}</small></span>
        <span style="min-width:0"><span class="ev-t" style="display:block">${e.title}</span><span class="ev-s" style="display:block">${e.series}・${e.host}</span></span>
        ${chip(st[0], st[1])}

  }).join('');

  <section class="ov-card span-8" aria-labelledby="ac-h">
    <div class="card-h"><h2 id="ac-h">學院講座<small>本月與下個月</small></h2><button class="more" data-go="academy">查看行事曆 →</button></div>
    <div class="ac-body">
      <article class="next" aria-label="下一場講座">
        <div class="next-when">
          <div class="datebox"><small>${n.m} 月</small><b class="num">${n.d}</b></div>
          <div class="next-meta"><span>週${n.w}・${SLOT[nx.slot]}</span><span>${nx.series}・${nx.tag}</span></div>
        </div>
        <h3>${nx.title}</h3>

    <div class="kpis">

      <div class="kpi"><span>累計出席</span><b class="num">${tot.people}<small>人次</small></b></div>
      <div class="kpi"><span>促成合作</span><b class="num">${tot.deals}<small>件</small></b></div>
      <div class="kpi"><span>平均滿意度</span><b class="num">${avg}<small>/ 5</small></b></div>
    </div>
    <article class="report">
      <div>
        <span class="r-meta">最新報告・${lf.md}（${lf.w}）・${lr.series}</span>
        <h3>${lr.title}</h3>

      </div>
      <button class="btn2 primary" data-go="reports">閱讀報告</button>
      <div class="r-stats">
        <div><b class="num">${lr.people}</b>人出席</div>
        <div><b class="num">${lr.companies}</b>家企業</div>
        <div><b class="num">${lr.deals}</b>件會後合作</div>
        <div><b class="num">${lr.score}</b>滿意度</div>
      </div>
      <p class="r-quote">${lr.note}</p>
    </article>
    <div class="r-older">
      ${REPORTS.slice(1,4).map(r => { const f = fmtMD(r.d); return `<button data-go="reports"><span class="d num">${f.md}</span><span class="t">${r.title}</span><span class="m">${r.people} 人・合作 ${r.deals} 件</span></button>`; }).join('')}

  /* ⑤ 俱樂部 */
  const mine = CLUBS.filter(c => c.joined), others = CLUBS.filter(c => !c.joined);
  const clubCard = `
  <section class="ov-card span-5" aria-labelledby="cl-h">
    <div class="card-h"><h2 id="cl-h">俱樂部<small>我加入的 ${mine.length} 個</small></h2><button class="more" data-go="clubs">查看全部 →</button></div>

      <button class="club" data-go="clubs">

/* ═════════ Render: Content（一覽頁以外先放佔位） ═════════ */
function renderContent(){
  const p = PAGES[state.route];
  if (state.route==='overview') { document.getElementById('content').innerHTML = renderOverview(); return; }
  document.getElementById('content').innerHTML = `
    <div class="page-head"><h1>${p.label}</h1><p>${p.desc}</p></div>
    <div class="placeholder">
      <div class="ph-icon">${svg(p.icon)}</div>
      <b>此頁內容待規劃</b>
      <span>範圍確認後再實作</span>
      ${p.src ? `<span class="src">對應規劃：2027 公關 SENSE 規劃 · ${p.src}</span>` : ''}
    </div>`;
}

/* ═════════ Router ═════════ */
function render(){
  if (!PAGES[state.route] || !visible(state.route)) state.route = 'overview';
  renderSidebar(); renderHeader(); renderContent();
}
function go(route){
  state.route = route;
  if (location.hash.slice(1) !== route) history.replaceState(null,'','#'+route);
  document.getElementById('app').classList.remove('nav-open');
  render();
  window.scrollTo(0,0);
}

/* ═════════ Events ═════════ */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-go],[data-inert],[data-toast],[data-toggle-pr],[data-pr-home]');
  if (!el) return;
  if (el.hasAttribute('data-toggle-pr')) { state.prOpen = !state.prOpen; renderSidebar(); }
  else if (el.hasAttribute('data-pr-home')) { state.prOpen = true; go('overview'); }
  else if (el.dataset.go) go(el.dataset.go);
  else if (el.hasAttribute('data-inert')) toast('此模組不在公關 SENSE 原型範圍內');
  else toast(el.dataset.toast);
});
document.addEventListener('keydown', e => {
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('.sb-mod.inert')) { e.preventDefault(); e.target.click(); }
});
document.getElementById('hamburger').onclick = () => document.getElementById('app').classList.add('nav-open');
document.getElementById('backdrop').onclick = () => document.getElementById('app').classList.remove('nav-open');
window.addEventListener('hashchange', () => { const r = location.hash.slice(1); if (r && r!==state.route) go(r); });

state.route = location.hash.slice(1) || 'overview';
render();
</script>
