<meta charset="utf-8">

<style>
  /* ── 本頁新增的元件（推導）：UI Library 尚未收錄，確認後再移到 shared/ ── */
  /* 狀態標籤：已報名／開放報名／即將開放、消息／優惠 */
  .status{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:var(--tracking-wider);white-space:nowrap}
  .status.open{background:var(--mod-product-tint);color:var(--accent-border)}
  .status.soon{background:var(--black-100);color:var(--black-500)}
  .status.deal{background:var(--metric-bg);color:#C25E1F}
  .status.news{background:var(--mod-product-tint);color:var(--accent-border)}
  .meta-line{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-600)}
  /* 公司方塊 */
  .co-grid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .co-tile{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line-soft);border-radius:16px;background:var(--white);text-align:left;transition:border-color .15s}
  .co-tile:hover{border-color:var(--hover-teal)}
  .co-tile b{display:block;font-size:14px;font-weight:500;line-height:20px;letter-spacing:1.6px;color:var(--black-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .co-tile small{font-size:12px;line-height:18px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .co-tile > span:last-child{min-width:0}
  /* 俱樂部卡 */
  .club-grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
  .club-head{display:flex;align-items:center;gap:12px}
  .club-icon{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--mod-product-tint);color:var(--accent-border);font-size:18px}
  .club-name{font-size:16px;font-weight:700;line-height:24px;letter-spacing:var(--tracking-super)}
  .feed{display:flex;flex-direction:column}
  .feed-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-bottom:1px solid var(--black-100)}
  .feed-item:last-child{border-bottom:0}
  .feed-item p{font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-800)}
  .feed-item small{font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .verified{width:18px;height:18px;vertical-align:-3px;margin-left:6px}
  .ro-list{margin:0;padding-left:20px;font-size:15px;line-height:26px;letter-spacing:1.6px;color:var(--black-800)}
  /* 報名按鈕（表格內用的小尺寸，推導自 .btn-primary）、私密欄位提示、LINE 社群卡 */
  .reg-btn{height:32px;padding:0 16px;border-radius:var(--r-30);background:transparent;border:1px solid var(--black-300);color:var(--black-700);
    font-size:12px;font-weight:700;letter-spacing:var(--tracking-wider);white-space:nowrap;transition:border-color .15s,color .15s}
  .reg-btn:hover,.reg-btn:focus-visible{border-color:var(--black-600);color:var(--black-800)}
  /* 表格內的「已報名」：與入場券同款黑底白勾＋黑字 */
  .ev-joined{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;letter-spacing:var(--tracking-wider);color:var(--black-800);white-space:nowrap}
  .ev-joined svg{width:18px;height:18px;flex:none}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px}
  .private-note{font-size:12px;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  /* 客戶服務經理聯絡卡（推導） */
  .cs-card{display:flex;flex-direction:row;align-items:center;gap:20px;flex-wrap:wrap}
  .cs-avatar{width:56px;height:56px;flex:none;border-radius:50%;background:var(--black-100);display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--black-700)}
  .cs-info{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
  .cs-info b{font-size:16px;font-weight:700;letter-spacing:var(--tracking-super);color:var(--black-800)}
  .cs-info p{margin:4px 0 0;font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-700)}
  .cs-actions{display:flex;gap:12px;flex-wrap:wrap}
  .line-card{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .line-card p{font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-700);flex:1;min-width:240px}
  /* 下一場活動入場券：沿用 .ticket 外形（票面＋撕線＋票根），內容改為下一場活動（推導） */
  .tk-event{width:100%}
  .tk-event .ticket-body{flex:1;gap:24px;padding:24px 0}
  .tk-event .ticket-perf{margin:-24px 0}  /* 撕線要跟票身內距一致，缺口才會剛好落在票券邊緣 */
  .tk-date{width:76px;flex:none;padding:10px 0;border-radius:16px;background:var(--white);display:flex;flex-direction:column;align-items:center}
  .tk-date small{font-size:12px;font-weight:600;line-height:18px;letter-spacing:var(--tracking-wider);color:var(--black-600)}
  .tk-date b{font-size:34px;font-weight:500;font-style:italic;line-height:42px;color:var(--black-800)}
  .tk-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .tk-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;font-weight:500;letter-spacing:var(--tracking-wider);color:var(--black-600)}
  .tk-type{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:20px;background:var(--white);font-size:12px;font-weight:600;color:var(--black-700)}
  .tk-title{margin:0;font-size:20px;font-weight:700;line-height:30px;letter-spacing:var(--tracking-super);color:var(--black-800)}
  .tk-meta span{display:inline-flex;align-items:center;gap:6px}
  .tk-meta svg{width:16px;height:16px;flex:none;color:var(--black-500)}
  .tk-meta{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-600)}
  .tk-stub{width:176px;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
  .tk-joined{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700;letter-spacing:var(--tracking-super);color:var(--black-800)}
  .tk-joined svg{width:24px;height:24px;color:var(--black-800)}
  .tk-link{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:500;letter-spacing:var(--tracking-super);color:var(--black-800)}
  .tk-link svg{width:14px;height:14px;flex:none}
  .tk-link:hover{text-decoration:underline;text-underline-offset:4px}
  /* 已報名入場券輪播：後方疊一張露出右上角、左右箭頭、點點分頁（推導，依使用者草稿） */
  .tk-carousel{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:12px}
  .tk-carousel.single{grid-template-columns:minmax(0,1fr)}
  /* 疊票：依後面還剩幾張，最多再疊 2 張（共 3 層）；每層往右上錯開 12px，越後面顏色越深 */
  /* 預留空間依「最多會疊幾層」固定（--pad），切換時前方票券不會忽寬忽窄 */
  .tk-stack{--pad:0px;position:relative;padding:var(--pad) var(--pad) 0 0}
  .tk-stack .tk-back{position:absolute;width:auto;pointer-events:none}
  .tk-stack .tk-back.k1{--ticket:#E1D0C0;opacity:.8;z-index:1;top:calc(var(--pad) - 12px);right:calc(var(--pad) - 12px);bottom:12px;left:12px}
  .tk-stack .tk-back.k2{--ticket:#CDB8A3;opacity:.6;top:calc(var(--pad) - 24px);right:calc(var(--pad) - 24px);bottom:24px;left:24px}
  .tk-stack .tk-front{position:relative;z-index:2}
  /* 上方缺口露出的是後面那張票：前方缺口用第二張的顏色、第二張缺口用第三張的顏色，最後面那張維持白色。
     做法：藏起原本的白色缺口圖，在撕線頂端畫一個同尺寸的 V（深 7.28px、45 度斜邊），填上後面那張的顏色 */
  .tk-cut{display:none;position:absolute;top:0;left:50%;width:14.56px;height:7.28px;transform:translateX(-50%);
    background:var(--cut);clip-path:polygon(0 0,100% 0,50% 100%)}
  /* 後方票券半透明（第二張 80%、第三張 60%），缺口顏色用疊合後實際看到的顏色 */
  .tk-stack.depth-1 .tk-front{--cut:#E7D9CD}  /* 第二張 80% 疊在白底 */
  .tk-stack.depth-2 .tk-front{--cut:#E1D1C2}  /* 第二張 80% 疊在（第三張 60% 疊在白底）上 */
  .tk-stack.depth-2 .k1{--cut:#E1D4C8}        /* 第三張 60% 疊在白底 */
  .tk-stack:is(.depth-1,.depth-2) .tk-front .tk-cut,
  .tk-stack.depth-2 .k1 .tk-cut{display:block}
  .tk-stack:is(.depth-1,.depth-2) .tk-front .ticket-notch.top,
  .tk-stack.depth-2 .k1 .ticket-notch.top{display:none}
  .tk-nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--black-200);background:var(--white);display:grid;place-items:center;color:var(--black-600);
    filter:drop-shadow(0 2px 0 var(--black-200));transition:background .15s,color .15s}
  .tk-nav:hover:not([disabled]){background:var(--black-50);color:var(--black-800)}
  .tk-nav[disabled]{opacity:.35;cursor:default}
  .tk-nav svg{width:16px;height:16px}
  .tk-dots{display:flex;justify-content:center;align-items:center;gap:8px}
  .tk-dots button{width:8px;height:8px;border-radius:4px;background:var(--black-300);transition:width .2s,background .2s}
  .tk-dots button[aria-current="true"]{width:24px;background:var(--accent)}
  .tk-dots button{position:relative}
  .tk-dots button::before{content:"";position:absolute;inset:-8px}  /* 點擊範圍放大 */
  .tk-count{text-align:center;font-size:13px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  @media (max-width:767px){ .tk-carousel{grid-template-columns:minmax(0,1fr)} .tk-nav{display:none} }
  @media (min-width:768px){ .tk-head{display:contents} }
  @media (max-width:767px){
    .tk-event .ticket-body{align-items:stretch;padding:24px 24px 24px 0}
    .tk-head{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
    .tk-date{width:auto;flex-direction:row;align-items:baseline;gap:8px;padding:4px 14px;border-radius:12px}
    .tk-date b{font-size:22px;line-height:30px}
    .tk-title{font-size:18px;line-height:28px}
    .tk-stub{width:100%;flex-direction:row;justify-content:space-between;padding-top:14px;border-top:1px dashed rgba(0,0,0,.18)}
  }
  /* 我的公司：上方身分卡（左：縮圖＋認證標章＋名稱，右：三項公司屬性），其餘資訊列在下方（推導） */
  .profile{width:100%;display:flex;flex-direction:column;gap:28px}
  .pc-card{position:relative;width:100%;max-width:560px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;
    padding:28px 32px;border-radius:24px;background:var(--white);box-shadow:0 6px 24px rgba(0,0,0,.10)}
  .pc-id{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
  .pc-logo{position:relative;width:112px;height:112px;margin-bottom:8px}
  .pc-logo svg.logo{width:100%;height:100%;display:block;border-radius:28px;border:1px solid var(--black-200)}
  .pc-logo .badge{position:absolute;right:-8px;bottom:-8px;width:34px;height:34px;border-radius:50%;background:var(--white);display:grid;place-items:center}
  .pc-logo .badge svg{width:28px;height:28px}
  .pc-name{margin:0;font-size:26px;font-weight:700;line-height:34px;letter-spacing:var(--tracking-super);color:var(--black-800)}
  .pc-brand{font-size:14px;font-weight:500;letter-spacing:var(--tracking-wider);color:var(--black-600)}
  .pc-stats{margin:0;display:flex;flex-direction:column}
  .pc-stats div{padding:12px 0;border-bottom:1px solid var(--black-200)}
  .pc-stats div:first-child{padding-top:0}
  .pc-stats div:last-child{border-bottom:0;padding-bottom:0}
  .pc-stats dd{margin:0;font-size:22px;font-weight:700;line-height:30px;letter-spacing:var(--tracking-wider);color:var(--black-800)}
  .pc-stats dt{font-size:12px;font-weight:500;line-height:18px;letter-spacing:var(--tracking-wider);color:var(--black-600)}
  /* 名片斜紋裝飾：左上、右下兩個角落，SENSE 品牌漸層（設計稿 mock-pr-card.html 方案 A） */
  .pc-card{overflow:hidden}
  .pc-card > :not(.pc-deco){position:relative}
  .pc-deco{position:absolute;width:150px;height:110px;pointer-events:none}
  .pc-deco.tl{top:0;left:0}
  .pc-deco.br{right:0;bottom:0;transform:rotate(180deg)}
  /* 下方詳細資料預設收合（非必要資訊，避免佔太多空間） */
  .pc-head{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:20px}
  .pc-toggle{display:inline-flex;align-items:center;gap:8px}  /* 外觀沿用 .btn-outline（幽靈按鈕） */
  .pc-toggle.btn-outline,.pc-toggle.btn-outline:hover,.pc-toggle.btn-outline:focus-visible{border-color:transparent;background:transparent}  /* 不要外框線與底色，文字已足夠提示 */
  .pc-toggle.btn-outline:hover,.pc-toggle.btn-outline:focus-visible{color:var(--black-800)}  /* hover 只讓文字與箭頭變深黑，不用淡藍 */
  .pc-toggle svg{width:14px;height:14px;flex:none;transition:transform .2s}
  .pc-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
  .pc-list{list-style:none;margin:0;padding:0;width:100%;max-width:760px;display:flex;flex-direction:column;gap:20px}
  .pc-list > li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;align-items:start}
  .pc-list .ic{width:28px;height:28px;color:var(--black-700)}
  .pc-list .ic svg{width:24px;height:24px;margin-top:2px}
  .pc-list h3{margin:0 0 4px;font-size:15px;font-weight:700;line-height:24px;letter-spacing:var(--tracking-super);color:var(--black-800)}
  .pc-list p{margin:0;font-size:15px;line-height:26px;letter-spacing:1.6px;color:var(--black-800)}
  @media (max-width:559px){ .pc-card{grid-template-columns:minmax(0,1fr);padding:28px 24px} }
  .content > section, .content > .content-section{scroll-margin-top:calc(var(--header-h) + 16px)}
  @media (max-width:767px){ .club-grid{grid-template-columns:minmax(0,1fr)} }
</style>
</head>
<body>
<!-- 僅供內部使用，非經許可不得外流。公關 SENSE 一覽頁，以 UI Library（shared/）重新組裝；舊版（單一檔案）備份於 dist/pr-sense-prototype-20261012-V1.html。公司與活動資料沿用原版示意資料。 -->
<div class="app" data-module="pr" data-page="home">
  <aside class="sidebar" id="sidebar" aria-label="主選單"></aside>
  <div class="main">
    <header class="header" id="header"></header>

    <main class="content">
      <!-- 我的公司 -->
      <section class="content-section" id="me" aria-labelledby="h-me">
        <div class="section-title"><h2 id="h-me">我的公司</h2></div>
        <div class="profile" id="me-card"></div>
      </section>

      <!-- 近期活動 -->
      <section class="content-section" id="academy" aria-labelledby="h-academy">
        <div class="section-title"><h2 id="h-academy">近期活動</h2></div>
        <!-- 下一場活動入場券 -->
        <div id="ticket-slot" style="width:100%;display:flex;flex-direction:column;gap:20px"></div>
        <div class="form-card form-group" aria-label="接下來的場次"><div class="form-group-title"><h2>接下來的場次</h2></div><div style="overflow-x:auto"><table class="ro-table" id="ev-table"></table></div></div>
      </section>

      <!-- 公司名冊 -->
      <section class="content-section" id="directory" aria-labelledby="h-dir">
        <div class="section-title"><h2 id="h-dir">公司名冊</h2></div>
        <p class="field-help">依產業認識 SENSE 平台上的會員企業。</p>
        <div class="chips" id="ind-chips" role="group" aria-label="依產業篩選"></div>
        <div class="co-grid" id="co-grid"></div>
      </section>

      <!-- 活動回顧 -->
      <section class="content-section" id="reports" aria-labelledby="h-reports">
        <div class="section-title"><h2 id="h-reports">活動回顧</h2></div>
        <div class="card-grid" id="recap-grid"></div>
        <button type="button" class="add-link" id="more-recaps" data-toast="活動回顧列表頁尚未製作"></button>
      </section>

      <!-- 俱樂部 -->
      <section class="content-section" id="clubs" aria-labelledby="h-clubs">
        <div class="section-title"><h2 id="h-clubs">俱樂部</h2></div>
        <div class="club-grid" id="club-grid"></div>
        <div class="form-card form-group"><div class="form-group-title"><h2>最新消息與優惠</h2></div><div class="feed" id="club-feed"></div></div>
        <button type="button" class="add-link" id="more-clubs"></button>
        <div class="form-card form-group" aria-label="LINE 社群">
          <div class="form-group-title"><h2>LINE 社群</h2></div>
          <div class="line-card">
            <p>活動前後的即時交流先在 LINE 社群進行；線上俱樂部則用來經營長期人脈。</p>
            <button type="button" class="btn btn-secondary" data-toast="LINE 社群連結尚未提供（示意）">加入 LINE 社群</button>
          </div>
        </div>
      </section>

      <!-- 客戶服務經理 -->
      <section class="content-section" id="service" aria-labelledby="h-service">
        <div class="section-title"><h2 id="h-service">客戶服務經理</h2></div>
        <div class="form-card form-group cs-card">
          <span class="cs-avatar" aria-hidden="true">林</span>
          <div class="cs-info">
            <b>林佳穎</b><span class="field-help">公關 SENSE 客戶服務經理（示意）</span>
            <p>活動報名、會後交流或想認識特定企業，都可以直接找我協助安排。</p>
          </div>
          <div class="cs-actions">
            <button type="button" class="btn btn-secondary" data-toast="聯絡信箱尚未提供（示意）">寄信聯絡</button>
            <button type="button" class="btn btn-secondary" data-toast="預約功能尚未製作（示意）">預約 30 分鐘諮詢</button>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
SenseShell.mount();
const esc = SenseUI.esc;

/* ═════════ 示意資料（沿用 pr-sense.html，內部原型用） ═════════ */
const TODAY = '2026-10-16';
const WEEK = ['日','一','二','三','四','五','六'];
const ME = { companyId:'aidai' };
const COMPANIES = [
  { id:'stockfeel', name:'股感媒體科技', short:'股', ind:'金融科技', tint:'#1E40AF' }, { id:'anqian', name:'安錢感', short:'安', ind:'金融科技', tint:'#0F766E' },

const PC_BLUR = { tl:[[8, 1.2], [4, 0.6]], br:[[3, 0.8], [9, 1.5]] };  // [沿斜向, 垂直]：[粗帶, 細帶]

  const band = (n, pts, fill, op) => { const [a, b] = PC_BLUR[pos][n];
    return `<g transform="rotate(-45)"><g filter="url(#pcd-${pos}-b${n})"><g transform="rotate(45)"><polygon points="${pts}" fill="${fill}" opacity="${op}"/></g></g></g>`; };
  const blur = (n) => { const [a, b] = PC_BLUR[pos][n];
    return `<filter id="pcd-${pos}-b${n}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${a} ${b}"/></filter>`; };
  return `
  <svg class="pc-deco ${pos}" viewBox="0 0 150 110" overflow="visible" aria-hidden="true">
    <defs>
      <linearGradient id="pcd-${pos}-1" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0073F5"/><stop offset="1" stop-color="#42D6CD"/></linearGradient>

      ${blur(0)}${blur(1)}
    </defs>
    ${band(0, '0,38 38,0 64,0 0,64', `url(#pcd-${pos}-1)`, '.85')}
    ${band(1, '0,76 76,0 84,0 0,84', `url(#pcd-${pos}-2)`, '.9')}
  </svg>`;
};

const drawTicket = (dir = 0) => {
  const list = upcoming.filter(e => e.status === 'joined'), slot = document.getElementById('ticket-slot');
  if (!list.length){ slot.innerHTML = ''; slot.hidden = true; return; }
  slot.hidden = false;
  tkIdx = Math.min(Math.max(tkIdx, 0), list.length - 1);
  const many = list.length > 1, cur = list[tkIdx], hasNext = tkIdx < list.length - 1;
  const depth = Math.min(2, list.length - 1 - tkIdx);  // 後面還剩幾張就疊幾層，最多 2 層
  const pager = !many ? '' : list.length > 6
    ? `<p class="tk-count" aria-live="polite">${tkIdx + 1} / ${list.length}</p>`
    : `<div class="tk-dots" role="group" aria-label="切換已報名的活動">${list.map((e, i) => { const f = fmt(e.d);
        return `<button type="button" data-tk="${i}" aria-label="第 ${i + 1} 場：${f.m}/${f.d} ${esc(e.title)}" aria-current="${i === tkIdx}"></button>`; }).join('')}</div>`;
  slot.innerHTML = `
    <div class="tk-carousel${many ? '' : ' single'}" aria-roledescription="輪播" aria-label="我已報名的活動（共 ${list.length} 場）">

      <div class="tk-stack depth-${depth}" style="--pad:${Math.min(2, list.length - 1) * 12}px">${depth > 1 ? ticketHTML(null, 'tk-back k2') : ''}${depth > 0 ? ticketHTML(null, 'tk-back k1') : ''}${ticketHTML(cur, 'tk-front')}</div>
      ${many ? `<button type="button" class="tk-nav" data-tk-step="1" aria-label="下一場"${!hasNext ? ' disabled' : ''}>${ARROW('M6 3l5 5-5 5')}</button>` : ''}
    </div>
    ${pager}`;
  slot.querySelectorAll('.ticket').forEach(t => SenseUI.ticketLine(t));
  const front = slot.querySelector('.tk-front');

};

const drawEvents = () => {
  document.getElementById('ev-table').innerHTML = `<thead><tr><th>日期</th><th>活動</th><th>類型</th><th>名額</th><th>狀態</th></tr></thead><tbody>${
    upcoming.length ? upcoming.map(e => { const f = fmt(e.d); return `<tr><td style="white-space:nowrap">${f.m}/${f.d}（${f.w}）</td><td>${esc(e.title)}<br><small style="color:var(--black-500)">${esc(e.host)}</small></td><td style="white-space:nowrap">${EV_TYPE[e.type]}</td><td style="white-space:nowrap">${e.cap} 人</td><td>${e.status === 'open' ? regBtn(e) : e.status === 'joined' ? `<span class="ev-joined">${CHECK}已報名</span>` : status(e.status)}</td></tr>`; }).join('')
      : '<tr><td colspan="5" style="padding:20px 10px;color:var(--black-500)">目前沒有排定的場次。</td></tr>'}</tbody>`;
};
document.addEventListener('click', (e) => {
  const reg = e.target.closest('[data-reg]');
  if (reg){
    const ev = EVENTS.find(x => x.d === reg.dataset.reg); ev.status = 'joined';
    tkIdx = upcoming.filter(x => x.status === 'joined').indexOf(ev);  // 報名後直接切到這一張
    drawTicket(); drawEvents(); SenseShell.toast('已完成報名（示意）'); return;
  }
  const step = e.target.closest('[data-tk-step]');
  if (step){ goTicket(tkIdx + Number(step.dataset.tkStep)); return; }
  const dot = e.target.closest('[data-tk]');
  if (dot) goTicket(Number(dot.dataset.tk));
});
// 鍵盤：焦點在輪播內時用左右鍵切換；手機：左右滑動切換
const tkSlot = document.getElementById('ticket-slot');
tkSlot.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const n = upcoming.filter(x => x.status === 'joined').length, next = tkIdx + (e.key === 'ArrowRight' ? 1 : -1);
  if (next < 0 || next >= n) return;
  e.preventDefault(); goTicket(next);
  const d = tkSlot.querySelector(`[data-tk="${next}"]`); if (d && document.activeElement?.dataset.tk != null) d.focus();
});
let swipeX = null;
tkSlot.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') swipeX = e.clientX; });
tkSlot.addEventListener('pointerup', (e) => {
  if (swipeX == null) return; const dx = e.clientX - swipeX; swipeX = null;
  const n = upcoming.filter(x => x.status === 'joined').length;
  if (Math.abs(dx) > 40){ const next = tkIdx + (dx < 0 ? 1 : -1); if (next >= 0 && next < n) goTicket(next); }
});
drawTicket();
drawEvents();

/* ═════════ 公司名冊：依產業篩選 ═════════ */
const INDS = ['全部', ...new Set(COMPANIES.map(c => c.ind))].sort((a, b) => (a === '全部' ? -1 : b === '全部' ? 1 : (a === '其他') - (b === '其他')));
let ind = '全部';
const chipsEl = document.getElementById('ind-chips');
const drawDir = () => {
  chipsEl.innerHTML = SenseUI.chips(INDS.map(k => ({ key:k, label:k })), ind);
  const list = COMPANIES.filter(c => c.id !== ME.companyId && (ind === '全部' || c.ind === ind));
  document.getElementById('co-grid').innerHTML = list.map(c => `
    <button type="button" class="co-tile" data-toast="${esc(c.name)} 的公司頁尚未製作">
      ${SenseUI.orgLogo({ name:c.short, color:c.tint })}<span><b>${esc(c.name)}</b><small>${esc(c.ind)}</small></span>
    </button>`).join('');
};
chipsEl.addEventListener('click', (e) => { const b = e.target.closest('[data-chip]'); if (b){ ind = b.dataset.chip; drawDir(); } });
drawDir();

/* ═════════ 活動回顧：沿用商品卡元件，主圖用漸層示意 ═════════ */
// 只放最近 3 場，剛好排滿一列；其餘從「查看所有回顧」進入
document.getElementById('more-recaps').textContent = `查看所有回顧（共 ${RECAPS.length} 場）`;
document.getElementById('recap-grid').innerHTML = RECAPS.slice(0, 3).map((r, i) => { const f = fmt(r.d);
  return SenseUI.resourceCard({ id:'r' + i, title:r.title, org:{ name:r.host, color:'#9E9E9E' },
    metrics:[{ label:'日期', value:`${f.y}/${f.m}/${f.d}` }, { label:r.video ? '照片・影片' : '照片', value:`${r.photos} 張${r.video ? '＋精華' : ''}` }] })
    .replace('<span class="r-card-img"></span>', `<span class="r-card-img" style="background:${r.g}"></span>`); }).join('');
document.getElementById('recap-grid').addEventListener('click', (e) => { if (e.target.closest('[data-card]')) SenseShell.toast('活動回顧詳情尚未製作'); });

/* ═════════ 俱樂部 ═════════ */
const mine = CLUBS.filter(c => c.joined), others = CLUBS.filter(c => !c.joined);
document.getElementById('club-grid').innerHTML = mine.map(c => `
  <section class="form-card form-group" aria-label="${esc(c.name)}">
    <div class="club-head"><span class="club-icon" aria-hidden="true">${c.icon}</span><div style="flex:1;min-width:0"><div class="club-name">${esc(c.name)}</div><span class="field-help">${c.members} 家成員・發起：${esc(coById(c.founder).name)}</span></div></div>
    <div class="ro-chips"><span>${c.type}</span></div>
    <div class="meta-line"><span class="status news">新消息 ${c.news}</span><span class="status deal">新優惠 ${c.deals}</span></div>
  </section>`).join('');
document.getElementById('club-feed').innerHTML = CLUB_FEED.map(f => { const c = coById(f.co), cl = CLUBS.find(x => x.id === f.club);
  return `<div class="feed-item"><span class="status ${f.kind}">${f.kind === 'deal' ? '優惠' : '消息'}</span><div><p><b>${esc(c.name)}</b>　${esc(f.text)}</p><small>${esc(cl.name)}・${f.at}</small></div></div>`; }).join('');
const moreClubs = document.getElementById('more-clubs');
moreClubs.textContent = `還有 ${others.length} 個俱樂部可以加入`;
moreClubs.dataset.toast = '俱樂部列表頁尚未製作';

// 頁面上的 data-toast 由 shell.js 統一處理
</script>
