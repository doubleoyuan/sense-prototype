<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>兌換 SENSE</title>
<link rel="icon" type="image/svg+xml" href="shared/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/tokens.css?v=20261106c">
<link rel="stylesheet" href="shared/components.css?v=20261106a">
<link rel="stylesheet" href="shared/forms.css?v=20261028d">
<style>
  /* ── 兌換 SENSE 頁內元件：UI Library 尚未收錄，需求確認後再決定是否抽到 shared/ ──
     版型沿用點數 SENSE（數據卡、頁籤卡片、資訊卡、對話框），class 改以 ex- 開頭 */

  /* 右下角固定按鈕會蓋住內容，底部多留空間 */
  .content{padding-bottom:120px}

  /* 灰底示意框：圖片、截圖尚無素材時使用 */
  .ex-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;background:var(--black-100);color:var(--black-500);
    font-size:13px;font-weight:500;line-height:20px;letter-spacing:var(--tracking-wider);text-align:center}
  .ex-ph svg{width:28px;height:28px;flex:none;color:var(--black-400)}
  .ex-ph small{font-size:12px;font-weight:400;color:var(--black-400)}

  /* ── 數據盤：四張數據卡（樣式同點數 SENSE 的 .pt-stat，不放迷你圖） ── */
  .ex-dash{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
  /* 高度依內容（標題＋翻牌數字），不再固定 140px */
  .ex-stat{display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:16px 20px 20px;
    border:1px solid var(--black-200);border-radius:var(--r-20);background:var(--white);container-type:inline-size}
  .ex-stat-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .ex-stat-head .ic{width:18px;height:18px;flex:none;color:var(--black-400)}
  .ex-stat b{display:flex;align-items:flex-end;gap:6px;font-size:16px;font-weight:500;line-height:22px;letter-spacing:var(--tracking-wider);color:var(--black-600);white-space:nowrap}

  /* 翻牌數字（參考 React Bits 的 Split Flap Text）：每個數字一塊深藍牌，中間一道接縫；
     進入畫面時上半片往下翻，依序翻過幾個亂數後停在實際數字，由左到右錯開。
     字級依卡片寬度縮放（container query），最多 30px，窄卡片也不會超出 */
  .ex-flaps{display:inline-flex;align-items:flex-end;gap:.08em;font-size:clamp(16px,15cqi,30px);font-weight:700;line-height:1;letter-spacing:0;
    color:var(--ex-flap-fg);font-variant-numeric:tabular-nums}
  /* 牌色試做深藍底白字（2026-11-07），確認後再決定是否加進 tokens.css。
     試過淡藍底深藍字（底 color-mix(--mod-product 45%, 白)、上半片白 25%、白色接縫），使用者決定維持深藍 */
  .app[data-module="exchange"]{--ex-flap-bg:#1C3461;--ex-flap-fg:var(--white);--ex-flap-hi:rgba(255,255,255,.06);--ex-flap-seam:rgba(0,0,0,.5)}
  .ex-flap{position:relative;width:.72em;height:1.3em;flex:none;border-radius:.14em;background:var(--ex-flap-bg);perspective:4em}
  .ex-flap .h{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:var(--ex-flap-bg);backface-visibility:hidden}
  .ex-flap .top{top:0;border-radius:.14em .14em 0 0;transform-origin:bottom}
  .ex-flap .top::before{content:"";position:absolute;inset:0;background:var(--ex-flap-hi)}  /* 上半片稍亮，做出翻牌的層次 */
  .ex-flap .bot{top:50%;border-radius:0 0 .14em .14em;transform-origin:top}
  .ex-flap .h b{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font:inherit;color:inherit}
  .ex-flap .bot b{top:-100%}
  .ex-flap .flap{z-index:2}
  .ex-flap::after{content:"";position:absolute;left:0;right:0;top:50%;z-index:3;height:1px;margin-top:-.5px;background:var(--ex-flap-seam)}  /* 接縫 */

  /* ── CaseCard：案例卡片。沿用點數 SENSE 企業卡片的頁籤模板（只有公司頁籤） ──
     兩種前往方式：底部兩顆按鈕並列——左「案例詳情頁」、右「前往兌換平台」（新分頁開啟）；點卡片其他位置同樣進案例詳情頁。
     滑到按鈕上時卡片外框不變色，避免以為點的是整張卡片 */
  .ex-card{--ex-line:var(--black-300);display:flex;flex-direction:column;cursor:pointer;filter:drop-shadow(0 4px 0 var(--black-200))}
  .ex-card:hover:not(:has(.ex-card-actions:hover)),.ex-card:focus-visible{--ex-line:var(--hover-line);outline:0}
  .ex-tab{position:relative;z-index:1;margin-bottom:-1px;padding:14px 20px 12px;display:flex;align-items:center;gap:10px;
    background:var(--white);border:1px solid var(--ex-line);border-bottom:0;border-radius:var(--r-20) var(--r-20) 0 0}
  .ex-tab .org-name{min-width:0;font-size:14px;line-height:20px;letter-spacing:var(--tracking-super);color:var(--black-700);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-card-body{flex:1;display:flex;flex-direction:column;gap:16px;padding:10px 20px 20px;background:var(--white);border:1px solid var(--ex-line);
    border-radius:0 0 var(--r-30) var(--r-30)}
  .ex-shot{aspect-ratio:16/10;border:1px solid var(--black-200);border-radius:var(--r-16);overflow:hidden}
  /* 實際截圖：裁切填滿，保留畫面上緣（網站頁首） */
  .ex-img{background:var(--black-100)}
  .ex-img img{width:100%;height:100%;object-fit:cover;object-position:top}
  .ex-card-intro{display:flex;flex-direction:column;gap:4px}
  .ex-card-title{font-size:16px;font-weight:700;line-height:24px;letter-spacing:var(--tracking-super);color:var(--black-800);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* 產業：圖示 16px（不超過上方標題）；文字 13px、加粗 */
  .ex-industry{display:inline-flex;align-items:center;gap:6px;padding:4px 0;color:var(--accent);font-size:13px;font-weight:600;line-height:20px;letter-spacing:var(--tracking-wider)}
  .ex-industry svg{width:16px;height:16px;flex:none}
  /* 功能標籤緊接在產業／上線時間下方：抵掉卡片內 16px 間距的一部分，與上一列文字相距 10px（含文字列下方 4px 內距） */
  .ex-feats{display:flex;flex-wrap:wrap;gap:6px;margin-top:-10px}
  /* 產業與上線時間排成一列（圖示＋文字，樣式相同） */
  .ex-meta{display:flex;flex-wrap:wrap;align-items:center;column-gap:20px}
  /* 底部按鈕列：沿用表單的 .btn-secondary／.btn-primary，兩顆平分卡片寬度。
     卡片窄（4 欄時內容約 235px）放不下 .btn 的最小寬度 120px，改為可縮、內距與字距收小 */
  .ex-card-actions{display:flex;gap:12px;margin-top:auto}  /* 推到卡片底部，各卡片的按鈕才會對齊 */
  .ex-card-actions .btn{flex:1;min-width:0;padding:0 12px;letter-spacing:var(--tracking-wider);white-space:nowrap}

  /* 標籤：樣式同點數 SENSE 的 .pt-tag */
  .ex-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:600;
    letter-spacing:var(--tracking-wider);white-space:nowrap;background:var(--black-100);color:var(--black-600)}
  .ex-tag.blue{background:var(--mod-product-tint);color:var(--accent-border)}
  .ex-tag.orange{background:var(--metric-bg);color:var(--cta-orange)}
  .ex-tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* ── 票券商品卡：沿用 ResourceCard（.r-card），主圖改灰底示意框，左上角疊類型標籤 ── */
  .ex-prod .r-card-img{position:relative}
  .ex-prod .ex-ph{width:100%;height:100%}
  .ex-prod-type{position:absolute;left:12px;top:12px;height:24px;padding:0 10px;display:inline-flex;align-items:center;border-radius:20px;background:var(--white);
    border:1px solid var(--black-200);font-size:12px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--black-600)}

  /* ── 案例詳情頁（版型同點數 SENSE 企業內頁） ── */
  .ex-co-head{width:100%;display:flex;align-items:flex-start;gap:20px}
  .ex-co-head .org-logo{width:64px;height:64px;padding:4px;border-radius:var(--r-10)}
  .ex-co-head .org-logo .mono{width:54px;height:54px;border-radius:var(--r-8);font-size:24px}
  .ex-co-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
  .ex-co-title h1{font-size:24px;font-weight:700;line-height:32px;letter-spacing:var(--tracking-ultra)}
  .ex-co-title .sub{font-size:14px;line-height:22px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  /* 前往兌換平台：放在畫面截圖輪播下方置中，需登入的平台在按鈕下方另起一行加註 */
  .ex-ext-actions{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .ex-panel .ex-ext-actions .btn{width:auto}  /* 資訊卡內的按鈕預設滿版，這裡維持依文字寬度 */
  .ex-co-intro{font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-700)}
  /* 標題區放在左欄，右側申請卡從頁面頂端開始並固定（sticky），捲動左欄時一直看得到 */
  .ex-detail{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:40px;align-items:start}
  .ex-detail .ex-co{margin-bottom:20px}  /* 標題區與下方資訊卡相距 40px（同原本的區塊間距） */
  .ex-detail > div{display:flex;flex-direction:column;gap:20px;min-width:0}
  .ex-aside{position:sticky;top:calc(var(--header-h) + 20px)}
  .ex-panel .form-group-title h2{flex:1;min-width:0}
  .ex-panel-body{display:flex;flex-direction:column;gap:16px}
  .ex-note{font-size:13px;line-height:22px;letter-spacing:var(--tracking-wider);color:var(--black-600)}
  .ex-note.muted{color:var(--black-500)}
  .ex-panel .btn{width:100%}
  .ex-panel .btn svg{width:18px;height:18px;flex:none}

  /* 畫面截圖輪播：橫向捲動（手機可直接滑），左右鈕與圓點同步 */
  .ex-carousel{display:flex;flex-direction:column;gap:12px}
  .ex-stage{position:relative}
  .ex-slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;border:1px solid var(--black-200);border-radius:var(--r-16);
    scrollbar-width:none}
  .ex-slides::-webkit-scrollbar{display:none}
  .ex-slide{flex:0 0 100%;aspect-ratio:16/9;scroll-snap-align:start}
  .ex-nav{position:absolute;top:50%;width:40px;height:40px;margin-top:-20px;border-radius:50%;display:grid;place-items:center;
    background:var(--white);border:1px solid var(--black-200);filter:drop-shadow(0 2px 0 var(--black-200));color:var(--black-600);transition:opacity .15s}
  .ex-nav:hover{background:var(--black-50)}
  .ex-nav[disabled]{opacity:0;pointer-events:none}
  .ex-nav.prev{left:12px}
  .ex-nav.next{right:12px}
  .ex-nav svg{width:20px;height:20px}
  .ex-dots{display:flex;justify-content:center;gap:8px}
  .ex-dots button{position:relative;width:8px;height:8px;border-radius:4px;background:var(--black-300);transition:width .2s,background .2s}
  .ex-dots button::before{content:"";position:absolute;inset:-8px}  /* 可點範圍放大到 24px */
  .ex-dots button[aria-current="true"]{width:20px;background:var(--accent-border)}

  /* 主要功能說明：每項一列，左側圓形圖示 */
  .ex-feat-list{display:flex;flex-direction:column}
  .ex-feat{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--black-200)}
  .ex-feat:first-child{padding-top:0}
  .ex-feat:last-child{padding-bottom:0;border-bottom:0}
  .ex-feat-ic{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--mod-product-tint);color:var(--accent-border)}
  .ex-feat-ic svg{width:18px;height:18px}
  .ex-feat h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;line-height:24px;letter-spacing:var(--tracking-super)}
  .ex-feat p{font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-700)}
  .ex-types{display:flex;flex-direction:column;gap:12px}
  .ex-types .ro-item > div{display:flex;flex-wrap:wrap;gap:6px}

  /* 申請卡：淺藍標題列（同點數 SENSE 的交換點數卡） */
  .ex-xpanel{padding:0;overflow:hidden;border-color:var(--mod-product)}
  .ex-xp-head{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--step-highlight);color:var(--accent-border)}
  /* Figma 原稿 16px，放大 1.5 倍（使用者指定）；與標題相距 12px（同列內 gap） */
  .ex-xp-head > svg{width:24px;height:24px;flex:none}  /* 圖示與標題相距 8px（列內 gap 12 − 4） */
  .ex-xp-head h2{flex:1;min-width:0;font-size:18px;font-weight:700;line-height:32px;letter-spacing:var(--tracking-ultra)}
  .ex-xpanel > .ex-panel-body{padding:20px 20px 24px}

  /* ── 對話框：沿用點數 SENSE 的 .pt-dialog ── */
  .ex-dialog{width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);padding:0;border:0;border-radius:24px;background:var(--white);color:var(--black-800);
    box-shadow:0 20px 60px rgba(0,0,0,.18);letter-spacing:var(--tracking-ultra)}
  .ex-dialog.wide{width:min(720px,calc(100vw - 32px))}
  .ex-dialog::backdrop{background:rgba(0,0,0,.32)}
  .ex-dialog form{display:flex;flex-direction:column;max-height:calc(100vh - 48px)}
  .ex-dlg-head{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--black-200)}
  .ex-dlg-head h2{flex:1;font-size:17px;font-weight:700;letter-spacing:var(--tracking-super)}
  .ex-dlg-x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--black-500)}
  .ex-dlg-x:hover{background:var(--black-100)}
  .ex-dlg-body{padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:20px;font-size:14px;line-height:24px;letter-spacing:1.6px}
  .ex-dlg-foot{display:flex;justify-content:flex-end;gap:12px;padding:16px 24px;border-top:1px solid var(--black-200);flex-wrap:wrap}
  .ex-dlg-foot .spacer{flex:1}
  .ex-dlg-body .field{gap:8px}
  .ex-dlg-body .field-label{font-size:14px}
  .ex-dlg-body .form-row{gap:16px}
  .ex-dlg-body .input[readonly]{background:var(--black-50);color:var(--black-600)}  /* 帶入、不可修改 */

  /* 申請流程：送出申請 → 專人洽談 → 開發上線 */
  .ex-flow{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:var(--r-10);background:var(--step-highlight);
    font-size:13px;font-weight:600;line-height:22px;letter-spacing:var(--tracking-wider);color:var(--accent-border);flex-wrap:wrap}
  .ex-flow i{font-style:normal;color:var(--black-400)}
  .ex-flow + .ex-note{margin-top:-10px}

  /* 選項卡：同點數 SENSE 的 .pt-opt（radio／checkbox 共用），必要項目勾選後不可取消 */
  .ex-opts{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .ex-opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ex-opt{position:relative;display:flex;align-items:flex-start;gap:10px;padding:14px 16px;border:1px solid var(--black-200);border-radius:var(--r-16);cursor:pointer;
    transition:border-color .15s,background .15s}
  .ex-opt:hover{border-color:var(--black-400)}
  .ex-opt:has(input:checked){border-color:var(--accent-border);background:var(--step-highlight)}
  .ex-opt:has(input:disabled){cursor:default}
  .ex-opt:has(input:disabled):hover{border-color:var(--accent-border)}
  .ex-opt:has(input:focus-visible){outline:2px solid var(--accent-border);outline-offset:2px}
  .ex-opt input{margin:5px 0 0;accent-color:var(--accent-border)}
  .ex-opt b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;line-height:24px;letter-spacing:var(--tracking-wider)}
  .ex-opt small{display:block;font-size:12px;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .ex-opt .ex-tag{height:20px;padding:0 8px;font-size:11px}

  /* 送出完成 */
  .ex-done{display:flex;flex-direction:column;align-items:center;gap:10px;padding:24px 0 8px;text-align:center}
  .ex-done-ic{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--mod-product-tint);color:var(--accent-border)}
  .ex-done-ic.pending{background:var(--black-100);color:var(--black-500)}
  .ex-done-ic svg{width:28px;height:28px}
  .ex-done h3{font-size:18px;font-weight:700;line-height:32px;letter-spacing:var(--tracking-ultra)}
  .ex-done p{font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-600)}
  /* 申請內容摘要（申請處理中） */
  .ex-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px;padding:16px 20px;border-radius:var(--r-10);background:var(--black-50)}
  .ex-summary .ro-label{font-size:12px;line-height:20px;letter-spacing:var(--tracking-wider)}
  .ex-summary .ro-value{font-size:14px;line-height:22px;letter-spacing:var(--tracking-wider)}
  .ex-reset{font-size:13px;font-weight:500;letter-spacing:var(--tracking-wider);color:var(--black-500);text-decoration:underline;text-underline-offset:3px}
  .ex-reset:hover{color:var(--black-800)}

  /* 申請兌換平台：右下角固定按鈕，沿用 CtaButton。申請送出後改為灰色「申請處理中」 */
  .ex-fab{position:fixed;right:40px;bottom:32px;z-index:45}
  /* 案例詳情頁：雙欄時右側申請卡已固定在上方，不重複顯示；單欄時申請卡排到最下面，改用浮動按鈕 */
  @media (min-width:1280px){ .ex-fab.on-detail{display:none} }
  .ex-fab.is-pending{background:var(--black-100);border-color:var(--black-300);color:var(--black-600)}
  .ex-fab.is-pending .round-icon{background:linear-gradient(var(--white),var(--white)) padding-box,linear-gradient(var(--black-300),var(--black-300)) border-box}
  .ex-fab .round-icon svg{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%);color:var(--black-500)}

  @media (max-width:1279px){
    .ex-dash{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ex-detail{grid-template-columns:minmax(0,1fr)}
    .ex-aside{position:static}
  }
  @media (max-width:899px){ .ex-fab{right:16px;bottom:16px} }
  @media (max-width:767px){
    .ex-co-head .org-logo{width:48px;height:48px;padding:3px}
    .ex-co-head .org-logo .mono{width:40px;height:40px;font-size:18px}
    .ex-co-title h1{font-size:20px;line-height:28px}
    .ex-nav{display:none}  /* 手機直接左右滑 */
  }
  @media (max-width:559px){
    .ex-dash{gap:12px}
    .ex-stat{gap:12px;padding:14px 16px}
    .ex-stat b{font-size:14px;gap:4px}
    .ex-opts,.ex-opts.three{grid-template-columns:minmax(0,1fr)}

/* 翻牌數字：每個數字一塊牌（上下兩半），不加千分位逗號。
   會播動畫時先放空白牌，捲進畫面再翻到實際數字；不播時直接顯示數字 */
const FLAP = { flips:6, dur:118, stagger:30 };   // 每位數翻 6 次（含最後一次）、每次 0.118 秒、相鄰數字錯開 0.03 秒；6 位數整段約 0.8 秒（使用者指定，2026-11-07）
const flapMotion = 'IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches;
const halves = (ch) => `<span class="h top"><b>${ch}</b></span><span class="h bot"><b>${ch}</b></span>`;
function flapNumber(value){
  const s = String(value);   // 不加千分位逗號（使用者指定，2026-11-07）
  return `<span class="ex-flaps" role="img" aria-label="${s}">${[...s].map(ch =>
    `<span class="ex-flap" data-to="${ch}" aria-hidden="true">${halves(flapMotion ? '' : ch)}</span>`).join('')}</span>`;
}

/* 翻一次：靜態上半片先換成下一個字，舊字的上半片往下翻到 90°，接著新字的下半片從 90° 翻下來蓋住舊的下半片 */
function flipOnce(tile, to){
  return new Promise(resolve => {
    const top = tile.querySelector('.top b'), bot = tile.querySelector('.bot b');
    const make = (cls, ch, deg) => {
      const el = document.createElement('span');
      el.className = `h ${cls} flap`; el.innerHTML = `<b>${ch}</b>`; el.style.transform = `rotateX(${deg}deg)`;
      tile.appendChild(el); return el;
    };
    const from = top.textContent;
    const fallTop = make('top', from, 0), fallBot = make('bot', to, 90);
    top.textContent = to;
    const half = FLAP.dur / 2;
    fallTop.animate([{ transform:'rotateX(0deg)' }, { transform:'rotateX(-90deg)' }], { duration:half, easing:'ease-in', fill:'forwards' }).onfinish = () => {
      fallTop.remove();
      fallBot.animate([{ transform:'rotateX(90deg)' }, { transform:'rotateX(0deg)' }], { duration:half, easing:'ease-out', fill:'forwards' }).onfinish = () => {
        bot.textContent = to; fallBot.remove(); resolve();
      };
    };
  });
}
/* 每次翻牌依固定時間點開始（不等上一次結束），每格之間的換幀延遲不會累積，整段長度才穩定 */
function flipTile(tile, delay){
  const seq = [];
  let prev = '';
  for (let i = 1; i < FLAP.flips; i++){
    let d; do { d = String(Math.floor(Math.random() * 10)); } while (d === prev);
    seq.push(prev = d);
  }
  seq.push(tile.dataset.to);
  seq.forEach((d, i) => setTimeout(() => flipOnce(tile, d), delay + i * FLAP.dur));
}
/* 捲進畫面時播一次；每張數據卡各自從第一位數開始錯開 */
const flapIO = flapMotion ? new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    flapIO.unobserve(e.target);
    e.target.querySelectorAll('.ex-flap').forEach((t, i) => flipTile(t, i * FLAP.stagger));
  });
}, { threshold:.6 }) : null;
function playFlaps(root){ if (flapIO) root.querySelectorAll('.ex-flaps').forEach(el => flapIO.observe(el)); }

function filtered(){
  const q = state.query.toLowerCase();
  const list = PRODUCTS.filter(p => (state.cat === 'all' || p.cat === state.cat)
    && (!q || [p.name, p.store, p.type, p.cat].some(t => t.toLowerCase().includes(q))));
  const by = { newest:(a, b) => b.order - a.order, low:(a, b) => a.price - b.price, high:(a, b) => b.price - a.price }[state.sort];
  return list.sort(by);
}

function renderList(){
  const list = filtered();
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  state.page = Math.min(state.page, pages);
  const slice = list.slice((state.page - 1) * PER_PAGE, state.page * PER_PAGE);
  document.getElementById('grid').innerHTML = slice.length
    ? slice.map(productCard).join('')
    : `<p class="empty" style="grid-column:1/-1">找不到符合「${esc(state.query || state.cat)}」的票券商品<br>換個關鍵字或分類試試看</p>`;

}

/* 輪播：左右鈕捲動一張，圓點跟著捲動位置更新 */
function bindCarousel(root){
  const track = root.querySelector('.ex-slides'), dots = [...root.querySelectorAll('[data-dot]')];
  const prev = root.querySelector('.prev'), next = root.querySelector('.next');
  const go = (i) => track.scrollTo({ left:i * track.clientWidth });
  const sync = () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    dots.forEach((d, k) => d.setAttribute('aria-current', k === i));
    prev.disabled = i === 0; next.disabled = i === dots.length - 1;
    return i;
  };
  root.addEventListener('click', (e) => {
    const s = e.target.closest('[data-slide]'), d = e.target.closest('[data-dot]');
    if (s) go(sync() + +s.dataset.slide);
    if (d) go(+d.dataset.dot);
  });
  track.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight'){ e.preventDefault(); go(sync() + 1); }
    if (e.key === 'ArrowLeft'){ e.preventDefault(); go(sync() - 1); }
  });
  track.addEventListener('scroll', sync, { passive:true });
  sync();
}

/* ═════════ 路由：主頁（#cases、#products 捲到區塊）、#case=x1 案例詳情 ═════════ */
const app = document.querySelector('.app');
let current = null;
function route(){
  const m = location.hash.match(/^#case=(\w+)/);
  const c = m && CASES.find(x => x.id === m[1]);
  current = c || null;
  document.getElementById('view-home').hidden = !!c;
  document.getElementById('view-case').hidden = !c;
  app.dataset.page = c ? 'case' : 'home';
  if (c) app.dataset.crumb = c.platform; else delete app.dataset.crumb;
  SenseShell.refresh();
  renderFab(!c);
  if (c){ renderCase(c); window.scrollTo(0, 0); }
  else {
    const id = location.hash.slice(1);
    if (['dashboard','cases','products'].includes(id)) document.getElementById(id).scrollIntoView({ block:'start' });
  }
}
// 申請狀態改變後重畫按鈕與申請卡
function rerender(){
  renderFab(!current);
  if (current) document.getElementById('xp').innerHTML = applyPanel();
}

/* ═════════ 對話框 ═════════ */
const dlg = document.getElementById('dlg'), form = document.getElementById('dlg-form');
let onSubmit = null;
function openDialog({ title, body, foot, wide = false, submit = null }){
  dlg.classList.toggle('wide', wide);
  form.innerHTML = `
    <div class="ex-dlg-head"><h2 id="dlg-title">${title}</h2><button type="button" class="ex-dlg-x" data-close aria-label="關閉">×</button></div>
    <div class="ex-dlg-body">${body}</div>
    <div class="ex-dlg-foot">${foot}</div>`;
  onSubmit = submit;
  if (!dlg.open) dlg.showModal();
  const first = form.querySelector('.ex-dlg-body input:not([readonly]):not([type=radio]):not([type=checkbox]), .ex-dlg-foot .btn-primary');
  if (first) first.focus();
}
form.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) dlg.close(); });
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });  // 點背景關閉
form.addEventListener('submit', (e) => { e.preventDefault(); if (onSubmit) onSubmit(); });

/* 申請兌換平台：申請 → 平台洽談 → 開發上線，無法自動產生 */
function openApply(){
  const select = (name, items) => `<select class="select" name="${name}" required>
      <option value="" disabled selected>請選擇</option>${items.map(i => `<option>${i}</option>`).join('')}</select>`;
  const field = (label, html, { req = false, error = '' } = {}) => `
    <div class="field"><label class="field-label">${label}${req ? '<span class="req">*</span>' : ''}</label>${html}
      ${error ? `<span class="field-error">${error}</span>` : ''}</div>`;
  const opt = (type, name, value, head, sub, { checked = false, locked = false } = {}) => `
    <label class="ex-opt"><input type="${type}" name="${name}" value="${value}"${checked ? ' checked' : ''}${locked ? ' disabled' : ''}>
      <span><b>${head}</b><small>${sub}</small></span></label>`;
  openDialog({
    title:'申請兌換平台', wide:true,
    body:`
      <div class="ex-flow" aria-label="申請流程"><span>送出申請</span><i>→</i><span>專人洽談</span><i>→</i><span>開發上線</span></div>
      <p class="ex-note">兌換平台需完成 SSO 與點數串接，無法自動開通。送出後專人將與您聯繫，洽談串接細節與上線時程。</p>
      <div class="form-row">
        ${field('企業名稱', `<input class="input" name="company" value="${esc(ME.name)}" readonly>`)}
        ${field('會員規模', select('members', MEMBER_SIZES), { req:true, error:'請選擇會員規模' })}
      </div>
      <div class="form-row">
        ${field('聯絡人', '<input class="input" name="contact" placeholder="姓名" required>', { req:true, error:'請填寫聯絡人' })}
        ${field('聯絡電話', '<input class="input" type="tel" name="phone" placeholder="例：02-1234-5678" required>', { req:true, error:'請填寫聯絡電話' })}
      </div>
      ${field('Email', '<input class="input" type="email" name="email" placeholder="name@company.com" required>', { req:true, error:'請填寫有效的 Email' })}
      <div class="field"><span class="field-label">是否已有點數制度</span>
        <div class="ex-opts">
          ${opt('radio', 'hasPoints', 'yes', '已有點數制度', '會員已能累積與使用點數', { checked:true })}
          ${opt('radio', 'hasPoints', 'no', '尚未建立', '可與專人討論點數規劃')}
        </div>
      </div>
      <div class="field"><span class="field-label">需要的串接</span>
        <div class="ex-opts three">
          ${opt('checkbox', 'sso', 'sso', `${FEATURES.sso.label}<span class="ex-tag blue">必要</span>`, '會員用原帳號登入', { checked:true, locked:true })}
          ${opt('checkbox', 'points', 'points', `${FEATURES.points.label}<span class="ex-tag blue">必要</span>`, '查詢與扣抵會員點數', { checked:true, locked:true })}
          ${opt('checkbox', 'pay', 'pay', `${FEATURES.pay.label}<span class="ex-tag">選配</span>`, '點數不足時補差額')}
        </div>
      </div>
      ${field('預計上線時間', select('launch', LAUNCHES))}
      ${field('備註', '<textarea class="textarea short" name="memo" placeholder="其他想讓我們知道的事"></textarea>')}`,
    foot:`<button type="button" class="btn btn-secondary" data-close>取消</button><button type="submit" class="btn btn-primary">送出申請</button>`,
    submit(){
      let ok = true;
      ['members','contact','phone','email'].forEach(n => {
        const el = form.elements[n], bad = !el.value.trim() || (n === 'email' && !el.checkValidity());
        el.classList.toggle('is-invalid', bad); el.closest('.field').classList.toggle('has-error', bad);
        if (bad && ok){ el.focus(); ok = false; }
      });
      if (!ok) return;
      const f = form.elements;
      application = { date:today(), contact:f.contact.value.trim(), phone:f.phone.value.trim(), email:f.email.value.trim(), members:f.members.value,
        hasPoints:f.hasPoints.value === 'yes', feats:['sso','points', ...(f.pay.checked ? ['pay'] : [])], launch:f.launch.value || '尚未確定' };
      saveApplication(application); rerender();
      openDialog({
        title:'申請兌換平台',
        body:`<div class="ex-done"><span class="ex-done-ic">${IC_CHECK}</span><h3>已收到您的申請</h3>
          <p>專人將與您聯繫，洽談 SSO 與點數串接細節。<br>處理期間可隨時在本頁查看申請內容。</p></div>`,
        foot:`<button type="button" class="btn btn-primary" data-close>完成</button>`
      });
    }
  });
}

/* 申請處理中：顯示送出的內容；左下角可重設示範狀態（原型用） */
function openStatus(){
  const a = application;
  const item = (label, value) => `<div class="ro-item"><span class="ro-label">${label}</span><span class="ro-value">${esc(value)}</span></div>`;
  openDialog({
    title:'申請處理中',
    body:`
      <div class="ex-done"><span class="ex-done-ic pending">${IC_CLOCK}</span><h3>專人將與您聯繫</h3>
        <p>已於 ${a.date} 送出申請，我們正在安排專人洽談。</p></div>
      <div class="ex-summary">
        ${item('聯絡人', a.contact)}${item('聯絡電話', a.phone || '—')}${item('Email', a.email)}
        ${item('會員規模', a.members)}${item('點數制度', a.hasPoints ? '已有點數制度' : '尚未建立')}
        ${item('需要的串接', a.feats.map(f => FEATURES[f].short).join('、'))}${item('預計上線時間', a.launch)}
      </div>`,
    foot:`<button type="button" class="ex-reset" data-reset>重設示範狀態</button><span class="spacer"></span>
      <button type="button" class="btn btn-primary" data-close>關閉</button>`
  });
}
form.addEventListener('click', (e) => {
  if (!e.target.closest('[data-reset]')) return;
  application = null; saveApplication(null); rerender(); dlg.close();
  SenseShell.toast('已重設為尚未申請');
});

function today(){
  const d = new Date(), p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())}`;
}

/* ═════════ 事件 ═════════ */
SenseShell.mount();

renderDash();
renderCases();
renderChips();
renderList();
document.getElementById('chips').addEventListener('click', (e) => {
  const b = e.target.closest('[data-chip]'); if (!b) return;
  state.cat = b.dataset.chip; state.page = 1; renderChips(); renderList();
});
const actions = document.getElementById('list-actions');
actions.innerHTML = SenseUI.listActions({ sorts:SORTS, sort:state.sort, placeholder:'搜尋商品或店家名稱' });
SenseUI.bindListActions(actions, {
  onQuery: (q) => { state.query = q; state.page = 1; renderList(); },
  onSort:  (k) => { state.sort = k; state.page = 1; renderList(); }
});
document.getElementById('pager').addEventListener('click', (e) => {
  const b = e.target.closest('[data-page]'); if (!b || b.disabled) return;
  state.page = +b.dataset.page; renderList();
  document.getElementById('products').scrollIntoView({ behavior:'smooth', block:'start' });
});

// 案例卡片：底部連結開兌換平台，其他位置進案例詳情
const caseGrid = document.getElementById('case-grid');
caseGrid.addEventListener('click', (e) => {
  const ext = e.target.closest('[data-ext]');
  if (ext){ e.preventDefault(); return openPlatform(CASES.find(c => c.id === ext.dataset.ext)); }
  const c = e.target.closest('[data-case]'); if (c) location.hash = 'case=' + c.dataset.case;
});
caseGrid.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-case]')){ e.preventDefault(); location.hash = 'case=' + e.target.dataset.case; }
});

document.getElementById('fab').addEventListener('click', () => application ? openStatus() : openApply());

document.getElementById('view-case').addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-ext]'); if (!t || !current) return;
  if (t.dataset.ext) return openPlatform(current);
  if (t.dataset.act === 'apply') openApply();
  if (t.dataset.act === 'status') openStatus();
});

window.addEventListener('hashchange', route);
route();
</script>
