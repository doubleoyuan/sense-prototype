<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>財務 SENSE</title>
<link rel="icon" type="image/svg+xml" href="shared/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="shared/tokens.css?v=20261028d">
<link rel="stylesheet" href="shared/components.css?v=20261028d">
<link rel="stylesheet" href="shared/forms.css?v=20261028d">
<style>
  /* ── 財務 SENSE 頁內元件（推導）：UI Library 尚未收錄，需求確認後再決定是否抽到 shared/ ── */
  .fs-view{width:100%;display:flex;flex-direction:column;gap:40px}
  .fs-lead{font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-600)}
  .fs-note{font-size:12px;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-muted{color:var(--black-500)}
  .section-title .fs-aside{flex:none;display:flex;align-items:center;gap:8px}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .btn.btn-sm{min-width:0;height:32px;padding:0 16px;font-size:12px;letter-spacing:var(--tracking-wider);filter:drop-shadow(0 2px 0 var(--black-200))}
  .btn.danger{color:var(--danger)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
  .btn.block{width:100%}
  .fs-link{font-size:13px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--link-blue)}
  .fs-link:hover{text-decoration:underline;text-underline-offset:4px}
  .fs-spacer{flex:1}

  /* 狀態標籤 */
  .fs-tag{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:600;
    letter-spacing:var(--tracking-wider);white-space:nowrap;background:var(--black-100);color:var(--black-600)}
  .fs-tag.blue{background:var(--mod-product-tint);color:var(--accent-border)}
  .fs-tag.green{background:#E7F6EE;color:#1F8A57}
  .fs-tag.orange{background:var(--metric-bg);color:#C25E1F}
  .fs-tag.gold{background:#FFF6DB;color:var(--mod-finance-strong)}
  .fs-tag.dark{background:var(--black-800);color:var(--white)}
  .fs-tag .dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  /* 卡片：沿用 form-card 外框 */
  .fs-card{width:100%;padding:20px;border:1px solid var(--black-300);border-radius:var(--r-16);background:var(--white);box-shadow:0 4px 0 0 var(--black-200)}
  .fs-card h3{font-size:16px;font-weight:700;line-height:28px;letter-spacing:var(--tracking-super)}
  .fs-card-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--black-200)}
  .fs-card-head h3{flex:1;min-width:0}

  /* 頭像：首字色塊（不使用照片、不放金融機構 Logo） */
  .fs-avatar{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--av,#9E9E9E);color:var(--white);font-size:16px;font-weight:700;letter-spacing:0}
  .fs-avatar.round{border-radius:50%}
  .fs-avatar.lg{width:72px;height:72px;border-radius:20px;font-size:28px}
  .fs-avatar.anon{background:var(--black-200);color:var(--black-600)}

  /* 我的檔案進度列（整合在入口與瀏覽頁上方） */
  .fs-profilebar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:24px;align-items:center}
  .fs-id{display:flex;align-items:center;gap:14px;min-width:0}
  .fs-id h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fs-progress{height:8px;border-radius:8px;background:var(--black-200);overflow:hidden;margin:6px 0}
  .fs-progress i{display:block;height:100%;background:var(--accent);border-radius:8px}
  .fs-progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;letter-spacing:var(--tracking-wider)}

  /* 指標 */
  .fs-picker{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .fs-picker > span{font-size:12px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--black-500);margin-right:4px}

  /* 首頁第一列：我的檔案（直式，1/3）＋待處理事項（2/3），兩張卡等高（2026-10-27 使用者確認） */
  .fs-home-top{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:20px}
  .fs-home-top > .content-section > .fs-card{flex:1}
  .fs-profilecard{display:flex;flex-direction:column;gap:16px}
  .fs-profilecard .fs-progress-meta{margin-top:auto}
  .fs-profilecard .btn{align-self:flex-start}
  .fs-todo-more{display:block;width:100%;padding-top:12px;border-top:1px solid var(--black-100);text-align:center;font-size:13px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--black-600)}
  .fs-todo-more:hover{color:var(--hover-teal)}
  /* 首頁按鈕：藍框藍字白底，避免實心藍太多（2026-10-27 使用者確認，先只用在首頁；尺寸與陰影同 btn-primary） */
  .fs-btn-outline{background:var(--white);border:1px solid #CFE3FD;color:var(--accent-border);filter:drop-shadow(0 4px 0 #E3EEFD)}
  .btn.fs-btn-outline.btn-sm{filter:drop-shadow(0 2px 0 #E3EEFD)}  /* 小尺寸的陰影位移是 2px（.btn.btn-sm），這裡只換顏色 */
  .fs-btn-outline:hover{background:#F5F9FF}
  /* 首頁：募資／融資／併購三條路徑卡（外框沿用 ResourceCard） */
  .fs-paths{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
  .fs-path-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:20px;border:1px solid var(--line-soft);border-radius:var(--r-30);background:var(--white);transition:border-color .15s}
  .fs-path-card:hover{border-color:var(--hover-teal)}
  .fs-path-card h3{font-size:18px;font-weight:700;line-height:28px;letter-spacing:var(--tracking-ultra)}
  /* 標題螢光筆：只墊字的下半部，顏色沿用黃色標籤底色（2026-10-27 取代重複的「○○審視」標籤，先只用在首頁） */
  .fs-marker{padding:0 4px;background:linear-gradient(transparent 55%,#FFF6DB 55%)}
  .fs-path-card p{flex:1;font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-600)}
  .fs-path-card .count{font-size:13px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--black-500);margin-bottom:6px}
  /* 首頁：專屬顧問卡（推導自公關 SENSE 的客戶服務經理卡） */
  .fs-avatar.round.lg{border-radius:50%}
  .fs-advisor{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .fs-advisor .info{flex:1;min-width:240px;display:flex;flex-direction:column;gap:4px}
  .fs-advisor .info b{font-size:16px;letter-spacing:var(--tracking-super)}
  .fs-advisor .info p{margin-top:4px;font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-700)}

  /* 動態列表 */
  .fs-activity{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--black-100)}
  .fs-activity:last-child{border-bottom:0}
  .fs-activity .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--black-100);font-size:14px;font-weight:700;color:var(--black-700)}
  .fs-activity b{display:block;font-size:14px;font-weight:600;line-height:22px;letter-spacing:1.6px}
  .fs-activity small{font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}

  /* 列表＋篩選 */
  .fs-split{width:100%;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
  .fs-filters{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(var(--header-h) + 20px)}
  .fs-filters > summary{display:none}
  .fs-fgroup{display:flex;flex-direction:column;gap:8px}
  .fs-flabel{font-size:13px;font-weight:700;letter-spacing:var(--tracking-wider);color:var(--black-700)}
  .fs-check{display:flex;align-items:center;gap:8px;font-size:13px;letter-spacing:var(--tracking-wider);color:var(--black-700);cursor:pointer}
  .fs-check input{width:16px;height:16px;flex:none;accent-color:var(--accent-border);margin:0}
  .fs-listbar{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:36px;font-size:13px;letter-spacing:var(--tracking-wider);color:var(--black-600)}
  .fs-listbar b{color:var(--black-800)}
  .fs-cards{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}

  /* 資訊卡（企業／投資人／項目／融資方案）：外框沿用 ResourceCard */
  .fs-entity{display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r-30);transition:border-color .15s;min-width:0}
  .fs-entity:hover{border-color:var(--hover-teal)}
  .fs-entity-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .fs-entity h3{font-size:16px;font-weight:700;line-height:24px;letter-spacing:var(--tracking-super)}
  .fs-entity .sub{font-size:13px;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-entity-head{display:flex;align-items:center;gap:12px;min-width:0}
  .fs-match{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:var(--tracking-wider);color:var(--accent-border);white-space:nowrap}
  .fs-match:hover{text-decoration:underline;text-underline-offset:4px}
  .fs-entity .r-card-metrics{padding:10px 16px}
  .fs-entity .r-card-metrics .metric b{font-size:13px;letter-spacing:var(--tracking-wider);white-space:normal;line-height:20px}
  .fs-path{font-size:12px;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-600);padding:6px 10px;border-radius:10px;background:var(--black-50)}
  .fs-path::before{content:"⌘ ";color:var(--black-400)}
  .fs-more summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--black-500);list-style:none}
  .fs-more summary::-webkit-details-marker{display:none}
  .fs-more summary::after{content:" ＋"}
  .fs-more[open] summary::after{content:" －"}
  .fs-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin-top:10px}
  .fs-fact span{display:block;font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-fact b{font-size:13px;font-weight:500;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-800)}
  .fs-fact.span-2{grid-column:1/-1}
  .fs-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
  .fs-follow[aria-pressed="true"]{border-color:var(--hover-teal);color:#2E8F8B}
  .fs-amount{font-size:22px;font-weight:500;font-style:italic;letter-spacing:var(--tracking-wider);color:var(--black-800)}

  /* 我的檔案 */
  .fs-hero{display:flex;flex-direction:column;gap:20px}
  .fs-hero-main{display:grid;grid-template-columns:auto minmax(0,1fr) 260px;gap:24px;align-items:start}
  .fs-hero h1{font-size:22px;font-weight:700;line-height:32px;letter-spacing:var(--tracking-super);margin:6px 0 4px}
  .fs-hero .headline{font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-700)}
  .fs-hero .meta{font-size:13px;letter-spacing:var(--tracking-wider);color:var(--black-500);margin-top:4px}
  .fs-aff{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:var(--r-16);background:var(--black-50)}
  .fs-aff div span{display:block;font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-aff div b{font-size:14px;font-weight:600;letter-spacing:var(--tracking-wider)}
  .fs-layout{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
  .fs-stack{display:flex;flex-direction:column;gap:20px;min-width:0;width:100%}
  .fs-prose{font-size:14px;line-height:26px;letter-spacing:1.6px;color:var(--black-800)}
  .fs-about{display:flex;flex-direction:column;gap:14px}
  .fs-about b{font-size:14px;letter-spacing:var(--tracking-wider)}
  .fs-member{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:10px 0;border-bottom:1px solid var(--black-100)}
  .fs-member:last-child{border-bottom:0}
  .fs-member b{font-size:14px;letter-spacing:var(--tracking-wider)}
  .fs-member span{font-size:12px;line-height:20px;letter-spacing:var(--tracking-wider);color:var(--black-600)}

  /* 外包與技術資源（10/13 週會新增） */
  .fs-tech-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .fs-tech-sum div{padding:12px 14px;border-radius:var(--r-16);background:var(--metric-bg)}
  .fs-tech-sum span{display:block;font-size:12px;font-weight:600;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-tech-sum b{font-size:15px;font-weight:600;letter-spacing:var(--tracking-wider)}

  /* 動態 */
  .fs-composer{display:flex;flex-direction:column;gap:12px}
  .fs-composer .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .fs-composer .select{width:200px;height:40px;padding:6px 48px 6px 16px}
  .fs-group-label{font-size:12px;font-weight:700;letter-spacing:var(--tracking-wider);color:var(--black-500);padding:12px 0 4px}
  .fs-post{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--black-100)}
  .fs-post:last-child{border-bottom:0}
  .fs-post-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fs-post-head b{font-size:14px;letter-spacing:var(--tracking-wider)}
  .fs-post-head small{display:block;font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-post p{font-size:14px;line-height:24px;letter-spacing:1.6px}
  .fs-post .ops{display:flex;gap:16px}

  /* 誰看過我、連結請求 */
  .fs-viewrow{display:grid;grid-template-columns:40px minmax(0,1fr) 60px auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--black-100)}
  .fs-viewrow b{display:block;font-size:14px;letter-spacing:var(--tracking-wider)}
  .fs-viewrow span,.fs-viewrow time{font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-repeat{font-size:12px;font-weight:700;color:var(--cta-orange)!important;margin-right:8px}
  .fs-request{display:flex;flex-direction:column;gap:12px}
  .fs-request-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .fs-request-head > div{flex:1;min-width:200px}
  .fs-request-head b{display:block;font-size:15px;letter-spacing:var(--tracking-wider)}
  .fs-request-head span{font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-reqmeta{display:flex;flex-wrap:wrap;gap:8px 24px;font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}
  .fs-reqmeta b{display:block;font-size:13px;font-weight:600;color:var(--black-800)}
  .fs-quote{margin:0;padding:14px 16px;border-radius:var(--r-16);background:var(--black-50);font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-800)}
  .fs-request-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .fs-request-foot time{font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-500)}

  /* 表格 */
  .fs-table-wrap{width:100%;overflow-x:auto}
  .fs-table-wrap .ro-table td{vertical-align:middle}
  .fs-file{display:flex;align-items:center;gap:10px}
  .fs-fileicon{width:36px;height:24px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--black-100);font-size:10px;font-weight:700;letter-spacing:0;color:var(--black-600)}
  .fs-switch{position:relative;display:inline-block;width:40px;height:22px;vertical-align:middle}
  .fs-switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
  .fs-switch i{position:absolute;inset:0;border-radius:22px;background:var(--black-300);transition:background .15s;pointer-events:none}
  .fs-switch i::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--white);transition:transform .15s}
  .fs-switch input:checked + i{background:var(--accent)}
  .fs-switch input:checked + i::after{transform:translateX(18px)}
  .fs-switch input:focus-visible + i{outline:2px solid var(--accent-border);outline-offset:2px}
  .fs-audit{display:grid;grid-template-columns:150px 140px 90px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--black-100);font-size:13px;letter-spacing:var(--tracking-wider)}
  .fs-banner{width:100%;display:flex;flex-direction:column;gap:2px;padding:14px 18px;border-radius:var(--r-16);background:#E7F6EE;color:#1F8A57;font-size:13px;line-height:22px;letter-spacing:var(--tracking-wider)}
  .fs-banner b{font-size:14px}
  .fs-banner.warn{background:var(--metric-bg);color:#C25E1F}

  /* 訊息 */
  .fs-msg{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:520px;padding:0;overflow:hidden}
  .fs-threads{border-right:1px solid var(--black-200);display:flex;flex-direction:column}
  .fs-threads .chips{padding:14px;min-height:0;border-bottom:1px solid var(--black-200)}
  .fs-thread{display:flex;flex-direction:column;gap:6px;padding:14px;border-bottom:1px solid var(--black-100);text-align:left}
  .fs-thread:hover{background:var(--black-50)}
  .fs-thread[aria-current="true"]{background:var(--mod-product-tint)}
  .fs-thread .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;letter-spacing:var(--tracking-wider)}
  .fs-thread .top time{font-size:12px;color:var(--black-500)}
  .fs-thread p{font-size:12px;letter-spacing:var(--tracking-wider);color:var(--black-600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .fs-chat{display:flex;flex-direction:column;min-width:0}
  .fs-chat-head{padding:14px 20px;border-bottom:1px solid var(--black-200);font-size:14px;letter-spacing:var(--tracking-wider)}
  .fs-chat-head small{display:block;font-size:12px;color:var(--black-500)}
  .fs-chat-body{flex:1;padding:20px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
  .fs-bubble{max-width:72%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--black-100);font-size:14px;line-height:22px;letter-spacing:1.6px;align-self:flex-start}
  .fs-bubble.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--mod-product-tint)}
  .fs-bubble time{display:block;margin-top:4px;font-size:11px;color:var(--black-500)}
  .fs-composer-bar{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--black-200)}

  /* 融資診斷 */
  .fs-narrow{width:100%;max-width:760px;margin:0 auto}
  .fs-q{font-size:18px;font-weight:700;line-height:30px;letter-spacing:var(--tracking-super);margin:4px 0 16px}
  .fs-opts{display:grid;gap:10px}
  .fs-opt{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1px solid var(--black-200);border-radius:var(--r-16);font-size:14px;letter-spacing:var(--tracking-wider);transition:border-color .15s,background .15s}
  .fs-opt:hover{border-color:var(--accent)}
  .fs-opt .rd{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid var(--black-300)}
  .fs-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--step-highlight)}
  .fs-opt[aria-pressed="true"] .rd{border:5px solid var(--accent)}
  .fs-result{font-size:22px;font-weight:700;letter-spacing:var(--tracking-super);margin:6px 0 8px}
  .fs-ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:24px;letter-spacing:1.6px;color:var(--black-700)}
  .fs-disclosure{border-top:1px solid var(--black-200);padding-top:14px}
  .fs-card.fs-disclosure{border-top:1px solid var(--black-300);padding-top:20px}

function todoItems(){

    ndaRequests.filter(r => r.state === 'pending').forEach(r =>
      list.push({ ic:'簽', title:`${r.org} 已簽署${r.doc}，等你完成雙方簽署`, sub:`${r.contact} · ${r.date}`, btn:`<button type="button" class="btn fs-btn-outline btn-sm" data-act="view-nda" data-id="${r.id}">檢視並簽署</button>` }));
    requests.filter(r => r.state === 'L1').forEach(r => { const i = investors.find(x => x.id === r.investor);
      if (!perms[i.org] || perms[i.org].every(v => !v)) list.push({ ic:'權', title:`${i.org} 已連結（L1），資料室尚未開放任何檔案`, sub:'完成 NDA 後可依角色套用預設權限', btn:`<a class="btn btn-secondary btn-sm" href="#roomadmin">設定權限</a>` }); });

  if (has('investor')){
    links.filter(l => l.state === 'L1').forEach(l => { const c = companies.find(x => x.id === l.company);
      list.push({ ic:'簽', title:`${unlockedName(c)} 已開放 L1 具名資訊`, sub:'可申請線上簽署 NDA，進一步查看資料室', btn:`<a class="btn fs-btn-outline btn-sm" href="#company-${c.id}">查看</a>` }); });
    const waiting = links.filter(l => l.state === 'pending');

  }
  return list;
}

  return [['年營收', c.rev], ['年成長率', c.growth], ['募資金額', c.raise]];

  if (c.track === 'loan') return [['毛利率', c.margin], ['資金用途', c.use], ['成立年數', c.years + ' 年'], tech];
  if (c.track === 'ma') return [['毛利率', c.margin], ['年成長率', c.growth], ['交易背景', c.reason, true], tech];

/* ── 融資服務：需求診斷＋融資方案（方案依 10/13 週會可展示，但不放金融機構 Logo） ── */
function finAssess(ans){
  const [use, amount, collateral, bank, urgency] = ans, big = amount === '3,000 萬以上';
  const tools = [
    {name:'應收帳款融資',fit:collateral === '應收帳款' ? '高' : (use === '營運週轉' ? '中' : '低'),reason:collateral === '應收帳款' ? '你已有應收帳款可作為擔保基礎，核貸速度通常較快。' : '若主要擔保品不是應收帳款，這個工具的額度與速度優勢較難發揮。'},
    {name:'不動產抵押貸款',fit:collateral === '不動產' ? (big ? '高' : '中') : '低',reason:collateral === '不動產' ? '不動產擔保通常能爭取到較高額度與較低利率，特別適合金額較大的需求。' : '需要產權清楚的不動產作為擔保，你目前的擔保品狀況較不符合。'},
    {name:'設備／資產基礎融資',fit:collateral === '設備或存貨' ? '高' : (use === '設備或軟體採購' ? '中' : '低'),reason:collateral === '設備或存貨' ? '可用現有設備或存貨作為擔保，適合中期資金需求。' : '較適合有實體設備或存貨可供擔保的情況。'},
    {name:'信用貸款／營運週轉方案',fit:(collateral === '目前沒有明確的擔保品' && bank !== '尚無穩定往來關係' && !big) ? '高' : (collateral === '目前沒有明確的擔保品' ? '中' : '低'),reason:bank === '已有多家穩定往來' ? '你已有穩定銀行往來紀錄，較容易以信用狀況取得核貸；但通常額度較適合中小型需求。' : '在沒有明確擔保品的情況下仍可考慮，但需要更完整的財務資料佐證。'},
    {name:'信保基金搭配',fit:bank === '尚無穩定往來關係' ? '高' : '中',reason:bank === '尚無穩定往來關係' ? '由信保基金提供保證，是尚無穩定銀行往來紀錄的企業常見的敲門磚。' : '即使已有往來銀行，信保基金仍可用來提高核貸額度或降低擔保要求。'}];
  const order = { '高':0, '中':1, '低':2 }; tools.sort((a, b) => order[a.fit] - order[b.fit]);
  return { top:tools[0], tools, urgent:urgency === '1 個月內，較急迫',
    docs:['最近 1–3 年財務報表（資產負債表、損益表、現金流量表）','401／403 申報資料與營所稅結算申報書','近 6 個月往來銀行存摺明細','若有擔保品：產權或所有權證明文件'] };
}

const CRUMB = { settings:'編輯我的檔案', company:'企業詳情', dataroom:'財務資料室' };
const PAGES = { home:homePage, browse:browsePage, investors:investorsPage, profile:profilePage, settings:settingsPage, views:viewsPage, requests:requestsPage,
  links:linksPage, roomadmin:roomAdminPage, dataroom:dataRoomPage, messages:messagesPage, financing:financingPage, ma:maPage, company:() => companyDetail(state.detailId) };
const NOW = () => '2026.10.26 ' + new Date().toTimeString().slice(0, 5);

function parseHash(){
  const h = location.hash.slice(1);
  const m = h.match(/^company-(\d+)$/);
  if (m){ state.detailId = +m[1]; return 'company'; }
  if (/^set-/.test(h)) return 'settings';   // 編輯頁的分段錨點
  return PAGES[h] ? h : 'home';
}
function render(){
  let page = parseHash();
  if (PAGE_ROLE[page] && !has(PAGE_ROLE[page])) page = 'home';
  const changed = page !== state.page;
  // 編輯頁點分段標籤只是捲動，不重畫
  if (!changed && page === 'settings' && /^set-/.test(location.hash.slice(1))) return;
  state.page = page;
  app.dataset.page = page;
  app.dataset.role = state.roles.join(' ');
  if (CRUMB[page]) app.dataset.crumb = CRUMB[page]; else delete app.dataset.crumb;
  SenseShell.refresh();
  view.innerHTML = `<div class="fs-view">${PAGES[page]()}</div>`;
  afterRender(page);
  document.querySelectorAll('[data-demo-role]').forEach(b => b.setAttribute('aria-pressed', b.dataset.demoRole === (state.roles.length === 2 ? 'both' : state.roles[0])));
  if (changed){
    const anchor = /^set-/.test(location.hash.slice(1)) && document.getElementById(location.hash.slice(1));
    if (anchor) anchor.scrollIntoView(); else window.scrollTo(0, 0);
  }
}
function afterRender(page){
  view.querySelectorAll('.ticket').forEach(SenseUI.ticketLine);
  if (page === 'browse'){
    const box = document.getElementById('browse-actions');
    box.innerHTML = SenseUI.listActions({ query:state.browseQuery, sorts:[{key:'updated',label:'最新更新'},{key:'match',label:'條件符合度'}], sort:state.browseSort, placeholder:'搜尋產業或項目' });
    SenseUI.bindListActions(box, { onQuery:(q) => { state.browseQuery = q; browseList(); }, onSort:(k) => { state.browseSort = k; browseList(); } });
    browseList();
  }
  if (page === 'investors'){
    const box = document.getElementById('inv-actions');
    box.innerHTML = SenseUI.listActions({ query:state.investorQuery, sorts:[{key:'match',label:'條件符合度'},{key:'rate',label:'回應率'},{key:'active',label:'最近活躍'}], sort:state.investorSort, placeholder:'搜尋機構或領域' });
    SenseUI.bindListActions(box, { onQuery:(q) => { state.investorQuery = q; investorList(); }, onSort:(k) => { state.investorSort = k; investorList(); } });
    investorList();
  }
  if (page === 'settings'){
    SenseForm.sectionTabs(document.getElementById('set-tabs'));
    [['rev', revRange], ['margin', pctRange], ['growth', growthRange]].forEach(([id, fn]) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', () => { document.getElementById(id + '-hint').textContent = '→ 投資人將看到：' + fn(+el.value) + '　✓ 已匿名'; });
    });
  }
  if (page === 'financing' && state.finTab === 'quiz' && !state.finDone){
    SenseForm.stepper(document.getElementById('fin-stepper'), FINQUIZ, state.finStep + 1, { check:SenseShell.asset('ic-check.svg') });
  }
}
// 列表頁只重畫列表（保留搜尋框焦點），其他頁整頁重畫
function refreshView(){
  if (state.page === 'browse') browseList();
  else if (state.page === 'investors') investorList();
  else render();
}
const toggleFollow = (arr, id, on, off) => { const x = arr.find(o => o.id === id); x.followed = !x.followed; refreshView(); toast(x.followed ? on : off); };
const now = NOW;

/* ═════════ 互動 ═════════ */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-browse-tab],[data-fin-tab],[data-fin-opt],[data-thread],[data-thread-filter],[data-home-feed],[data-hero-co],[data-hero-inv],[data-demo-role]');
  if (!t) return;
  const d = t.dataset, id = d.id && /^\d+$/.test(d.id) ? +d.id : d.id;
  if (d.demoRole){ state.roles = d.demoRole === 'both' ? ['company','investor'] : [d.demoRole]; render(); return toast('原型示範：已切換為「' + t.textContent + '」視角'); }
  if (d.browseTab){ state.browseTab = d.browseTab; return browseList(); }
  if (d.finTab){ state.finTab = d.finTab; return render(); }
  if (d.finOpt){ const i = state.finStep; state.finAnswers[i] = FINQUIZ[i].opts[+d.finOpt]; if (i < FINQUIZ.length - 1) state.finStep++; else state.finDone = true; return render(); }
  if (d.thread){ state.activeThread = d.thread; return render(); }
  if (d.threadFilter){ state.threadFilter = d.threadFilter; return render(); }
  if (d.homeFeed){ state.homeFeed = d.homeFeed; return render(); }
  const pick = (arr, key) => { const i = arr.indexOf(key); i > -1 ? arr.splice(i, 1) : arr.push(key); render(); };
  if (d.heroCo) return pick(state.heroStats.company, d.heroCo);
  if (d.heroInv) return pick(state.heroStats.investor, d.heroInv);

  switch (d.act){
    case 'toast': return toast(d.msg);
    case 'done': closeModal(); return toast(d.msg);
    case 'radio-chip': t.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === t)); return;
    case 'reset-filter': state[{ companies:'companyFilters', investors:'investorFilters', financing:'financingFilters' }[id]] = []; return render();
    case 'follow-company': return toggleFollow(companies, id, '已追蹤此企業檔案；更新將出現在首頁。', '已取消追蹤。');
    case 'follow-investor': return toggleFollow(investors, id, '已追蹤此投資人。', '已取消追蹤。');
    case 'follow-project': return toggleFollow(projects, id, '已追蹤此項目，後續更新會出現在首頁。', '已取消追蹤項目。');
    case 'follow-financing': return toggleFollow(financing, id, '融資方案已收藏。', '已取消收藏。');
    case 'match': return matchModal(id);
    case 'project-detail': return projectModal(id, false);
    case 'project-contact': return projectModal(id, true);
    case 'financing-detail': return financingModal(id, false);
    case 'financing-apply': return financingModal(id, true);
    case 'connect-company': return connectModal(id, 'company');
    case 'connect-investor': return connectModal(id, 'investor');
    case 'hello': return helloModal(investors.find(x => x.id === id));
    case 'hello-request': return helloModal(investors.find(x => x.id === requests.find(r => r.id === id).investor));
    case 'approve': return approveModal(id);
    case 'decline': requests.find(x => x.id === id).state = 'declined'; render(); return toast('已婉拒，不需填理由，也不影響對方評價。');
    case 'confirm-approve': requests.find(x => x.id === id).state = 'L1'; closeModal(); render(); return toast('L1 具名資訊已由你開放；資料室仍維持關閉。');
    case 'preview-l0': return previewModal();
    case 'contact': return modal('聯絡資訊', `<dl class="ro-pairs"><dt>單位名稱</dt><dd>${ME.org}</dd><dt>聯絡窗口</dt><dd>${ME.name} · ${ME.tag}</dd><dt>平台訊息</dt><dd>可透過「訊息」功能直接聯繫</dd></dl>`, cancelBtn('關閉'));
    case 'share': try { navigator.clipboard.writeText(location.href.split('#')[0] + '#profile'); } catch (err) {} return toast('檔案連結已複製。');
    case 'post': {
      const text = document.getElementById('post-text').value.trim(); if (!text) return toast('請先輸入動態內容。');
      const role = has('company') ? 'company' : 'investor', me = identities[role];
      posts.unshift({ id:++postSeq, role, org:me.org, author:me.name, time:now(), type:document.getElementById('post-type').value, pinned:false, text });
      render(); return toast('動態已發布。');
    }
    case 'pin-post': { const p = posts.find(x => x.id === id); p.pinned = !p.pinned; render(); return toast(p.pinned ? '已設為置頂。' : '已取消置頂。'); }
    case 'delete-post': posts = posts.filter(x => x.id !== id); render(); return toast('已刪除動態。');
    case 'save-profile': {
      const v = (x) => { const el = document.getElementById(x); return el ? el.value : null; };
      if (v('bio-mode') != null){ bios.company.mode = v('bio-mode'); bios.company.seeking = v('bio-seeking'); }
      if (v('pref-focus') != null){ Object.assign(investorPrefs, { focus:v('pref-focus'), stage:v('pref-stage'), ticket:v('pref-ticket'), role:v('pref-role') }); bios.investor.mode = v('bio-mode-inv'); bios.investor.seeking = v('bio-seeking-inv'); }
      return toast('檔案已儲存；相關頁面的公開區間已同步更新。');
    }
    case 'withdraw': { const l = links.find(x => x.id === id); l.state = 'expired'; companies.find(x => x.id === l.company).status = null; render(); return toast('連結請求已撤回並關閉。'); }
    case 'nda': return ndaModal(id);
    case 'nda-doc': return ndaModal(id, d.doc);
    case 'submit-nda': {
      const c = companies.find(x => x.id === id); c.status = 'nda'; const l = links.find(x => x.company === id); if (l) l.state = 'nda';
      audits.unshift([now(), '你', '簽署' + DOCS[d.doc] + '並送出', unlockedName(c)]);
      closeModal(); render(); return toast('你已完成線上簽署並送出，等待對方完成雙方簽署後開放資料室。');
    }
    case 'view-nda': return ndaApproveModal(id);
    case 'confirm-nda': {
      if (t.dataset.step !== '2'){ t.dataset.step = '2'; t.textContent = '再按一次以完成雙方簽署'; return; }
      const r = ndaRequests.find(x => x.id === id); r.state = 'approved';
      perms[r.org] = roleTemplate[permGroup[r.org]].slice();
      audits.unshift([now(), '你', '完成雙方簽署', r.org]);
      closeModal(); render(); return toast(`已與 ${r.org} 完成雙方簽署，並套用「${ROLE_GROUPS[permGroup[r.org]]}」預設權限。`);
    }
    case 'viewfile': return viewer(id);
    case 'requestfile': t.disabled = true; t.textContent = '已申請'; return toast('已向企業申請這一份檔案的權限。');
    case 'send-msg': { const inp = document.getElementById('msg-text'); if (!inp.value.trim()) return; (sent[id] = sent[id] || []).push(inp.value.trim()); render(); return toast('訊息已送出。'); }
    case 'fin-back': if (state.finStep > 0){ state.finStep--; render(); } return;
    case 'fin-restart': state.finStep = 0; state.finAnswers = []; state.finDone = false; return render();
    case 'advisory': return advisoryModal();
    case 'ma-consult': return maConsultModal();
    case 'browse-track': state.browseTab = id; location.hash = 'browse'; return;
    case 'fin-plans': state.finTab = 'plans'; location.hash = 'financing'; return;
    case 'todo-all': state.todoAll = !state.todoAll; return render();
    case 'submit-connect': {
      if (d.side === 'company'){ const c = companies.find(x => x.id === id); c.status = 'pending'; state.investorQuota--; links.unshift({ id:'C-2611', company:id, date:'2026.10.26', state:'pending', days:14 }); }
      else { investors.find(x => x.id === id).state = 'pending'; state.companyQuota--; }
      closeModal(); render(); return toast('已送出。對方須在 14 天內明確回應，逾期將自動關閉。');
    }
    case 'send-hello': state.helloQuota--; closeModal(); return toast('招呼已送出；此動作不會升級關係或開放資訊。');
  }
});

document.addEventListener('change', (e) => {
  const t = e.target, d = t.dataset;
  if (d.filter){
    const key = { companies:'companyFilters', investors:'investorFilters', financing:'financingFilters' }[d.filter];
    state[key] = t.checked ? [...state[key], t.value] : state[key].filter(x => x !== t.value);
    return d.filter === 'financing' ? render() : refreshView();
  }
  if (d.permOrg){
    perms[d.permOrg][+d.i] = t.checked;
    audits.unshift([now(), '你', t.checked ? '開啟權限' : '關閉權限', files[+d.i] + ' → ' + d.permOrg]);
    render(); return toast(`已${t.checked ? '開啟' : '關閉'}「${files[+d.i]}」對 ${d.permOrg} 的權限。`);
  }
  if (d.tpl){ roleTemplate[d.tpl][+d.i] = t.checked; return toast(`已更新「${ROLE_GROUPS[d.tpl]}」的預設權限；之後完成 NDA 的對象會套用。`); }
  if (d.actChange === 'anonymous'){ state.anonymous = t.checked; render(); return toast(state.anonymous ? '已切換匿名瀏覽。' : '已切換具名瀏覽。'); }
  if (d.sig){
    const f = t.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => { signatures[d.sig] = rd.result; render(); toast('簽名已上傳並儲存。'); }; rd.readAsDataURL(f);
  }
  if (t.id === 'nda-agree') document.getElementById('submit-nda').disabled = !t.checked;
  if (t.id === 'nda-approve-agree') document.getElementById('confirm-nda').disabled = !t.checked;
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'reason'){ const n = t.value.trim().length, c = document.getElementById('reason-count'); c.textContent = n + ' / 100 字'; c.classList.toggle('ok', n >= 100); document.getElementById('submit-connect').disabled = n < 100; }
  if (t.id === 'hello-text'){ document.getElementById('hello-count').textContent = t.value.length + ' / 50 字'; document.getElementById('send-hello').disabled = !t.value.length; }
  if (t.classList.contains('range')) t.style.setProperty('--fill', t.value + '%');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'msg-text'){ e.preventDefault(); document.querySelector('[data-act="send-msg"]').click(); } });

SenseShell.mount();
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
